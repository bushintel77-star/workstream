<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>CAD Operator Studio - Zero Chrome</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        "colors": {
                "primary-fixed": "#e1e2e8",
                "primary-fixed-dim": "#c5c6cc",
                "error": "#ffb4ab",
                "error-container": "#93000a",
                "secondary-container": "#3a4a5f",
                "secondary-fixed": "#d3e4fe",
                "tertiary-fixed": "#e7e2d6",
                "on-tertiary-container": "#67645a",
                "inverse-on-surface": "#313030",
                "on-error-container": "#ffdad6",
                "secondary": "#b7c8e1",
                "background": "#131314",
                "surface-container-high": "#2a2a2a",
                "surface-variant": "#353435",
                "tertiary-fixed-dim": "#cac6ba",
                "tertiary": "#ffffff",
                "on-surface": "#e5e2e2",
                "outline": "#8f9095",
                "selection-white": "#ffffff",
                "on-error": "#690005",
                "surface-container-low": "#1c1b1c",
                "surface-container-lowest": "#0e0e0e",
                "primary-container": "#fbbf24",
                "on-tertiary-fixed": "#1d1c14",
                "on-primary-fixed": "#191c20",
                "on-primary": "#2e3135",
                "secondary-fixed-dim": "#b7c8e1",
                "surface-bright": "#3a3939",
                "on-tertiary-fixed-variant": "#49473e",
                "on-secondary": "#213145",
                "on-secondary-container": "#a9bad3",
                "on-primary-container": "#626469",
                "on-tertiary": "#323128",
                "inverse-primary": "#5c5e63",
                "on-surface-variant": "#c6c6cb",
                "on-secondary-fixed-variant": "#38485d",
                "surface": "#101418",
                "primary": "#fbbf24",
                "surface-tint": "#c5c6cc",
                "tertiary-container": "#e7e2d6",
                "on-background": "#e5e2e2",
                "strike-red": "#ef4444",
                "inverse-surface": "#e5e2e2",
                "glass-border": "rgba(255, 255, 255, 0.05)",
                "outline-variant": "#45474a",
                "on-primary-fixed-variant": "#44474c",
                "on-secondary-fixed": "#0b1c30",
                "surface-container-highest": "#353435",
                "surface-dim": "#101418",
                "surface-container": "#201f20",
                "signal-blue": "#0030CF"
        },
        "borderRadius": {
                "DEFAULT": "0.25rem",
                "lg": "0.5rem",
                "xl": "0.75rem",
                "full": "9999px"
        },
        "spacing": {
                "viewport-margin": "2rem",
                "chip-gap": "0.5rem",
                "stack-gap": "1rem",
                "hud-padding": "1.25rem"
        },
        "fontFamily": {
                "ui-label-lg": [
                        "Inter"
                ],
                "data-display-mobile": [
                        "Space Grotesk"
                ],
                "data-display-md": [
                        "Space Grotesk"
                ],
                "ui-label-sm": [
                        "Inter"
                ],
                "technical-metadata": [
                        "Space Grotesk"
                ],
                "data-display-lg": [
                        "Space Grotesk"
                ]
        },
        "fontSize": {
                "ui-label-lg": [
                        "14px",
                        {
                                "lineHeight": "20px",
                                "letterSpacing": "0.05em",
                                "fontWeight": "600"
                        }
                ],
                "data-display-mobile": [
                        "20px",
                        {
                                "lineHeight": "1.2",
                                "fontWeight": "600"
                        }
                ],
                "data-display-md": [
                        "24px",
                        {
                                "lineHeight": "1.2",
                                "letterSpacing": "-0.01em",
                                "fontWeight": "500"
                        }
                ],
                "ui-label-sm": [
                        "11px",
                        {
                                "lineHeight": "16px",
                                "letterSpacing": "0.08em",
                                "fontWeight": "500"
                        }
                ],
                "technical-metadata": [
                        "13px",
                        {
                                "lineHeight": "18px",
                                "letterSpacing": "0.02em",
                                "fontWeight": "400"
                        }
                ],
                "data-display-lg": [
                        "40px",
                        {
                                "lineHeight": "1.1",
                                "letterSpacing": "-0.02em",
                                "fontWeight": "600"
                        }
                ]
        }
},
    },
  }
</script>
<style>
        body {
            background-color: theme('colors.surface-dim');
            color: theme('colors.on-surface');
            overflow: hidden; /* Infinite canvas feel */
        }
        
        .grid-bg {
            background-size: 32px 32px;
            background-image: 
                linear-gradient(to right, rgba(224, 227, 232, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(224, 227, 232, 0.05) 1px, transparent 1px);
        }
        
        .grid-bg-fine {
            background-size: 4px 4px;
            background-image: 
                linear-gradient(to right, rgba(224, 227, 232, 0.02) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(224, 227, 232, 0.02) 1px, transparent 1px);
        }

        .hud-panel {
            background: rgba(16, 20, 24, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid theme('colors.glass-border');
        }
    </style>
</head>
<body class="w-screen h-screen relative flex flex-col font-ui-label-lg antialiased text-ui-label-lg">
<!-- Infinite Canvas Background -->
<div class="absolute inset-0 z-0 grid-bg">
<div class="absolute inset-0 grid-bg-fine"></div>
</div>
<!-- Main Workspace Area -->
<main class="absolute inset-0 z-10 w-full h-full pointer-events-none">
<!-- Canvas Objects (Simulated 3D/Vectors) -->
<div class="absolute inset-0 pointer-events-auto overflow-hidden">
<!-- Site Boundary Vector -->
<svg class="absolute top-1/4 left-1/4 w-[600px] h-[400px]" fill="none" viewbox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
<path d="M50 50 L550 100 L500 350 L100 300 Z" fill="rgba(0, 48, 207, 0.05)" stroke="#0030CF" stroke-dasharray="8 4" stroke-width="2"></path>
<circle cx="50" cy="50" fill="#0030CF" r="4"></circle>
<circle cx="550" cy="100" fill="#0030CF" r="4"></circle>
<circle cx="500" cy="350" fill="#0030CF" r="4"></circle>
<circle cx="100" cy="300" fill="#0030CF" r="4"></circle>
</svg>
<!-- Subsurface Utility Volume (Simulated) -->
<div class="absolute top-[40%] left-[45%] w-64 h-32 border border-outline-variant border-dashed rounded bg-surface-variant/20 backdrop-blur-sm flex items-center justify-center transform -rotate-12">
<span class="font-technical-metadata text-technical-metadata text-on-surface-variant">VOL_ID: S-092A</span>
</div>
<!-- Collision Alert -->
<div class="absolute top-[38%] left-[48%] z-20">
<div class="relative">
<div class="absolute inset-0 bg-strike-red rounded-full animate-ping opacity-50 w-4 h-4 -left-2 -top-2"></div>
<div class="w-2 h-2 bg-strike-red rounded-full relative z-10"></div>
</div>
<!-- Billboarded Chip -->
<div class="mt-2 ml-4 hud-panel px-3 py-1.5 rounded flex items-center gap-2 border-strike-red/50">
<span class="material-symbols-outlined text-strike-red text-[16px]">warning</span>
<span class="font-technical-metadata text-technical-metadata text-strike-red">STRIKE DETECTED: -4.2m</span>
</div>
</div>
<!-- Generic Metadata Chip -->
<div class="absolute top-1/4 left-1/4 -translate-x-1/2 -translate-y-full mb-2 hud-panel px-2 py-1 rounded">
<span class="font-technical-metadata text-[10px] text-on-surface-variant">PT_01 [34.0522, -118.2437]</span>
</div>
<!-- Drawing Vector Line (Active) -->
<svg class="absolute inset-0 w-full h-full pointer-events-none" viewbox="0 0 100% 100%">
<line stroke="#FBBF24" stroke-width="1.5" x1="50%" x2="65%" y1="50%" y2="70%"></line>
<circle cx="65%" cy="70%" fill="#FBBF24" r="3"></circle>
<circle cx="50%" cy="50%" fill="#FBBF24" r="3"></circle>
</svg>
</div>
<!-- Floating Instruments (Zero Chrome UI) -->
<div class="absolute top-viewport-margin left-viewport-margin pointer-events-auto">
<div class="hud-panel rounded-lg p-2 flex flex-col gap-2 w-12 items-center">
<button aria-label="Select" class="text-on-surface-variant p-2 hover:text-primary transition-all">
<span class="material-symbols-outlined">near_me</span>
</button>
<button aria-label="Draw" class="bg-primary text-surface-dim rounded-full p-2 scale-110 shadow-lg shadow-primary/20 active:scale-90 duration-150 transition-all">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">edit</span>
</button>
<button aria-label="Geometry" class="text-on-surface-variant p-2 hover:text-primary transition-all">
<span class="material-symbols-outlined">category</span>
</button>
</div>
</div>
<div class="absolute bottom-viewport-margin right-viewport-margin pointer-events-auto">
<div class="hud-panel rounded-lg p-4 w-64">
<div class="space-y-3">
<div class="flex justify-between items-center">
<span class="font-technical-metadata text-technical-metadata text-on-surface-variant">Layer</span>
<span class="font-technical-metadata text-technical-metadata text-primary">Active_Draw</span>
</div>
<div class="flex justify-between items-center">
<span class="font-technical-metadata text-technical-metadata text-on-surface-variant">Length</span>
<span class="font-technical-metadata text-technical-metadata text-on-surface">142.50m</span>
</div>
</div>
</div>
</div>
<div class="absolute bottom-viewport-margin left-viewport-margin pointer-events-auto">
<div class="hud-panel rounded-lg px-4 py-2 flex items-center gap-6 font-technical-metadata text-technical-metadata text-on-surface-variant">
<div class="flex gap-4">
<span>X: <span class="text-on-surface">340522.10</span></span>
<span>Y: <span class="text-on-surface">-118243.75</span></span>
<span>Z: <span class="text-on-surface">14.20m</span></span>
</div>
</div>
</div>
</main>
</body></html>
