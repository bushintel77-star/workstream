<style>/* Base styles mapped to tailwind classes in config */
body {
    @apply bg-background text-on-surface font-ui-label-lg;
    }
.glass-panel {
    @apply bg-surface-dim/70 backdrop-blur-md border border-white/5;
    }
.input-focus-ring {
    @apply focus: outline-none focus: ring-1 focus: ring-gold-highlight focus: border-transparent;
    }
/* Map Background Simulation */

    background-size: cover;
    background-position: center
    }
/* Crosshair */
.crosshair::before, .crosshair::after {
    content: "";
    position: absolute;
    background-color: #0030CF;
    /* Signal Blue */
    }
.crosshair::before {
    width: 100%;
    height: 1px;
    top: 50%;
    left: 0;
    transform: translatey(-50%)
    }
.crosshair::after {
    height: 100%;
    width: 1px;
    left: 50%;
    top: 0;
    transform: translatex(-50%)
    }</style>

<body class="absolute w-[100vw] h-[100vh] overflow-hidden">
<!-- Full Bleed Map Background -->

<div class="absolute inset-0 bg-surface/20"></div>
</div>
<!-- Signal Blue Origin Crosshair -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-8 h-8 crosshair pointer-events-none z-10 opacity-80"></div>
