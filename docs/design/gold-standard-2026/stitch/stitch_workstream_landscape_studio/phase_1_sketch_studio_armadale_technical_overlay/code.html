<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Phase 1: Sketch Studio (Armadale Framework)</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration -->
<script data-purpose="tailwind-config">
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            'surface': '#101418',
            'surface-dim': '#131314',
            'surface-bright': '#3a3939',
            'primary': '#f8f9ff',
            'accent': '#FFD166', // Approximate yellow from reference
          },
          fontFamily: {
            'sans': ['Inter', 'sans-serif'],
            'mono': ['Space Grotesk', 'monospace'],
          },
          borderRadius: {
            '2xl': '1rem',
          }
        }
      }
    }
  </script>
<!-- Custom Styles -->
<style data-purpose="layout-styles">
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0e0e0e; /* surface-container-lowest */
      color: #e2e2e2;
    }
    
    .glass-card {
      background-color: rgba(19, 19, 20, 0.7); /* surface-dim with opacity */
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    
    .canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .canvas-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      /* Slight subtle zoom/pan effect could be added here in a real app */
    }
  </style>
</head>
<body class="antialiased font-sans select-none text-sm">
<!-- BEGIN: Main Canvas -->
<main class="canvas-container">
<img alt="Armadale Property Site Truth" class="canvas-image" draggable="false" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBmORcXw3bpHuZRwaCr7RzeUSFSR0TtNHt9Rh31re_MBc4NJX1kAnks1qWBM3cXmc_vCNb2wwsZQZqucil4_TcNUrwy7dTn03viFBUGkk1nmeYhCWz7Q8sYTy_G5pjdUtWneEvZ_VqtsOFC-CHGISBngNzMR6Q5pGrJrY0lLMBkxDXrWXhwKbH_BQ-wEXgYk9uGTrgMi6n4MH9rFUlOwUPDeOFQOXTO2zLsVwAf754x3-r_-C9zYPLCcoL5DWANaqzUUZo"/>
</main>
<!-- END: Main Canvas -->
<!-- BEGIN: Left Instrument - Tool Ribbon -->
<div class="absolute left-6 top-1/2 -translate-y-1/2 glass-card rounded-2xl flex flex-col items-center py-4 px-2 space-y-6 z-10">
<!-- Icon placeholders -->
<button aria-label="Select" class="p-2 text-gray-400 hover:text-white transition-colors group relative">
<svg class="w-5 h-5" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
</button>
<div class="w-6 h-px bg-white/10"></div>
<button aria-label="Polyline" class="p-2 text-accent bg-white/5 rounded-lg hover:bg-white/10 transition-colors group relative">
<svg class="w-5 h-5" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
</button>
<button aria-label="Curve" class="p-2 text-gray-400 hover:text-white transition-colors group relative">
<svg class="w-5 h-5" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
</button>
<button aria-label="Area" class="p-2 text-gray-400 hover:text-white transition-colors group relative">
<svg class="w-5 h-5" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
</button>
</div>
<!-- END: Left Instrument -->
<!-- BEGIN: Right Instrument - Lens Dial -->
<div class="absolute right-6 top-1/2 -translate-y-1/2 glass-card rounded-2xl py-6 px-3 flex flex-col items-center z-10">
<span class="text-[10px] tracking-widest text-gray-500 uppercase mb-4 font-mono">Lens</span>
<div class="relative w-8 h-48 flex flex-col items-center justify-between py-2">
<!-- Track -->
<div class="absolute inset-y-0 w-px bg-white/10"></div>
<!-- Markers -->
<div class="w-4 h-px bg-white/20 z-10"></div>
<div class="w-4 h-px bg-white/20 z-10"></div>
<div class="w-8 h-px bg-accent z-10 shadow-[0_0_8px_rgba(255,209,102,0.6)]"></div>
<div class="w-4 h-px bg-white/20 z-10"></div>
<div class="w-4 h-px bg-white/20 z-10"></div>
<div class="w-4 h-px bg-white/20 z-10"></div>
</div>
<span class="text-xs text-blue-500 font-mono mt-4">24mm</span>
</div>
<!-- END: Right Instrument -->
<!-- BEGIN: Bottom Instrument - Maturity Model -->
<div class="absolute bottom-8 left-1/2 -translate-x-1/2 w-3/4 max-w-3xl glass-card rounded-2xl p-6 z-10">
<div class="flex justify-between items-end mb-4">
<h3 class="text-[11px] font-bold tracking-widest text-accent uppercase">Maturity Model</h3>
<span class="text-xs text-gray-300 font-mono">YEAR 3</span>
</div>
<div class="relative h-2 bg-surface-bright/50 rounded-full overflow-hidden">
<!-- Scrubber track -->
<div class="absolute top-0 left-0 h-full w-[30%] bg-accent rounded-full"></div>
</div>
<div class="flex justify-between mt-3 text-[10px] text-gray-500 font-mono">
<span>YR 0</span>
<span>YR 2</span>
<span class="text-white font-medium">YR 4</span>
<span>YR 6</span>
<span>YR 8</span>
<span>YR 10</span>
</div>
</div>
<!-- END: Bottom Instrument -->
<!-- BEGIN: Top Right Global Actions (Subtle) -->
<div class="absolute top-6 right-6 flex items-center space-x-4 z-10">
<button aria-label="Settings" class="p-2 text-gray-400 hover:text-white transition-colors">
<svg class="w-5 h-5" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
</button>
</div>
<!-- END: Top Right Global Actions -->
</body></html>
