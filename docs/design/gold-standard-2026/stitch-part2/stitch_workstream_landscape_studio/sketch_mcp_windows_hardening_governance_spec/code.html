<script>
        document.addEventListener('DOMContentLoaded', () => {
            const scrubber = document.getElementById('time-scrubber');
            const layerProposed = document.getElementById('layer-proposed');
            
            // Meta Chip Value Elements
            const elCost = document.getElementById('val-cost');
            const elDeltaCost = document.getElementById('delta-cost');
            const elDeltaCostInd = document.getElementById('delta-cost-indicator');
            
            const elConcrete = document.getElementById('val-concrete');
            const elDeltaConcrete = document.getElementById('delta-concrete');
            
            const elEarth = document.getElementById('val-earth');
            const elDeltaEarth = document.getElementById('delta-earth');

            // Target Values for "Proposed Design" (100%)
            const targets = {
                cost: 2450000,
                concrete: 1240,
                earth: 450 // net cut
            };

            const formatCurrency = (val) => '$' + val.toLocaleString('en-US');
            const formatVol = (val) => Math.round(val).toLocaleString('en-US');

            scrubber.addEventListener('input', (e) => {
                const progress = e.target.value / 100;
                
                // 1. Update Visual Canvas Transparency
                layerProposed.style.opacity = progress;

                // 2. Interpolate Data Values
                const currentCost = progress * targets.cost;
                const currentConcrete = progress * targets.concrete;
                const currentEarth = progress * targets.earth;

                // Update Cost
                elCost.innerHTML = formatCurrency(Math.round(currentCost));
                if(progress > 0) {
                    elDeltaCost.innerHTML = `+ ${formatCurrency(Math.round(currentCost))}`;
                    elDeltaCostInd.classList.remove('text-secondary-fixed-dim');
                    elDeltaCostInd.classList.add('text-error');
                    elDeltaCostInd.querySelector('.material-symbols-outlined').textContent = 'trending_up';
                } else {
                    elDeltaCost.innerHTML = `+ $0`;
                    elDeltaCostInd.classList.add('text-secondary-fixed-dim');
                    elDeltaCostInd.classList.remove('text-error');
                    elDeltaCostInd.querySelector('.material-symbols-outlined').textContent = 'horizontal_rule';
                }

                // Update Concrete
                elConcrete.innerHTML = `${formatVol(currentConcrete)}<span class="font-label-caps text-label-caps text-secondary-fixed-dim ml-1">m³</span>`;
                elDeltaConcrete.innerHTML = `+${formatVol(currentConcrete)} m³`;

                // Update Earthwork
                elEarth.innerHTML = `${formatVol(currentEarth)}<span class="font-label-caps text-label-caps text-secondary-fixed-dim ml-1">yd³</span>`;
                if(progress > 0.05) {
                    elDeltaEarth.innerHTML = `Net Cut`;
                    elDeltaEarth.parentElement.classList.replace('text-secondary-fixed-dim', 'text-tertiary-fixed-dim');
                } else {
                    elDeltaEarth.innerHTML = `Equilibrium`;
                    elDeltaEarth.parentElement.classList.replace('text-tertiary-fixed-dim', 'text-secondary-fixed-dim');
                }
            });
        });
    </script>
