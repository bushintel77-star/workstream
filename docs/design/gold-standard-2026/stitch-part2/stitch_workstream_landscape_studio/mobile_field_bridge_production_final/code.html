<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Workstream Studio - AR Field Bridge</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary": "#003641",

                        "on-error": "#690005",

                        "primary-fixed": "#ffdf9f",

                        "secondary-fixed-dim": "#bac3ff",
                        "signal-blue": "#0030CF",
                        "tertiary-fixed": "#afecff",
                        "inverse-primary": "#795900",
                        "cloud-mist": "#D7E1EC",
                        "error": "#ffb4ab",
                        "on-secondary-fixed-variant": "#002eca",
                        "surface-container": "#1c2024",
                        "on-secondary-fixed": "#00105b",
                        "tertiary": "#b6edff",
                        "on-background": "#e0e3e8",
                        "inverse-surface": "#e0e3e8",
                        "surface": "#101418",
                        "on-error-container": "#ffdad6",
                        "tertiary-fixed-dim": "#30d8fd",
                        "on-primary-fixed": "#261a00",
                        "on-primary-fixed-variant": "#5c4300",
                        "surface-container-highest": "#31353a",
                        "error-container": "#93000a",
                        "surface-container-low": "#181c20",
                        "secondary-container": "#0130cf",
                        "on-primary-container": "#6c4f00",
                        "on-tertiary-container": "#005c6e",
                        "inverse-on-surface": "#2d3135",
                        "surface-bright": "#2A3037",
                        "on-secondary": "#001f90",
                        "on-surface": "#e0e3e8",
                        "surface-container-lowest": "#0b0f12",
                        "surface-container-high": "#262a2f",
                        "background": "#101418",
                        "gold-highlight": "#FBBF24",
                        "surface-tint": "#f9bd22",
                        "on-surface-variant": "#d3c5ac",
                        "outline-variant": "#4f4633",
                        "tertiary-container": "#34daff",
                        "on-tertiary-fixed-variant": "#004e5d",
                        "primary-container": "#fbbf24",
                        "surface-variant": "#31353a",
                        "primary-fixed-dim": "#f9bd22",
                        "outline": "#9c8f79",
                        "on-secondary-container": "#a8b4ff",

                    "borderRadius": {
                        "DEFAULT": "0.125rem",

                    "spacing": {
                        "gutter": "16px",
                        "sidebar-width": "280px",
                        "unit": "4px",
                        "margin-safe": "32px",
                        "toolbar-width": "56px"
                    },
                    "fontFamily": {
                        "body-md": ["Inter"],
                        "headline-lg-mobile": ["Space Grotesk"],
                        "label-caps": ["JetBrains Mono"],

                    "fontSize": {

<style>.material-symbols-outlined {
    font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24
    }
.material-symbols-outlined[data-weight="fill"] {
    font-variation-settings: "FILL" 1
    }
/* Glass HUD utilities */
.glass-hud {
    background-color: rgba(16, 20, 24, 0.7);
    /* surface-dim/70 */
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(224, 227, 232, 0.1);
    /* on-surface/10 */
    }
/* Subsurface ghosting utility */
.subsurface-ghost {
    background: linear-gradient(135deg, rgba(0, 48, 207, 0.4), rgba(0, 48, 207, 0.1));
    border: 1px dashed rgba(0, 48, 207, 0.8);
    backdrop-filter: blur(4px)
    }
/* AR Staking Chip */
.ar-stake {
    position: absolute;
    transform: translate(-50%, -50%);
    pointer-events: none
    }
/* Camera Feed Simulation (Background) */
.bg-camera-feed {
    background-image: url(https://lh3.googleusercontent.com/aida-public/AB6AXuA6EHqWKKuI4QJOxrDb9xt57btpOahIhvZpw3qYs3hcw0_JVwJB4r1p3oE9N9avzhdFY1ML3wSNgaJn0W9MmjU6ztu2n9VREBeQjZZZLScwPQvGPyM9a5zwPsahMeR5WWBlHHFJVzATppKRuj_DyZHrzbdWedzgUAivJvGB5dY-Xi5PAaSkuqxIVz74IQYTtKIbiB7nC4RDqmjO9MS0OdiwI7C2kJOFRQvCKOSaUNioJTwpHUbSRHqKFA);
    background-size: cover;
    background-position: center
    }</style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface h-screen w-screen overflow-hidden selection:bg-gold-highlight selection:text-black">
<!-- Main AR Canvas / Camera Feed -->
<main class="relative w-full h-full bg-camera-feed" data-alt="A highly realistic first-person view through a mobile device camera of a residential backyard under construction. The scene is lit by harsh midday sun, casting strong shadows on bare dirt and marked survey stakes. The visual style is hyper-realistic, high-fidelity, and functional, matching a high-end architectural AR tool. Deep shadows contrast with bright highlights, emphasizing a professional, technical aesthetic.">
<!-- Top App Bar (Shared Component) - Rendered over camera feed -->
<header class="fixed top-0 w-full flex justify-between items-center h-[48px] px-margin w-full z-50 glass-hud border-b border-outline-variant dark:border-outline">
<div class="flex items-center gap-unit">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed-dim" data-icon="architecture">architecture</span>
<span class="font-headline-sm text-headline-sm font-bold text-primary dark:text-primary-fixed-dim">Workstream</span>
</div>
<!-- Top Right HUD Element -->
<div class="flex items-center gap-2">
<div class="px-2 py-1 bg-surface-dim border border-signal-blue rounded text-signal-blue font-technical-data text-technical-data">
                    RTK: FIX &lt;15mm
                </div>
</div>
</header>
<!-- Spatial Telemetry HUD (Floating Top Left, below app bar) -->
<div class="absolute top-[64px] left-4 glass-hud rounded-lg p-3 z-40 max-w-[200px]">
<div class="flex flex-col gap-1 font-technical-data text-technical-data">
<div class="text-on-surface-variant text-[10px] uppercase tracking-widest">Global Coordinates</div>
<div class="text-on-surface text-xs font-mono">N 34.0522°</div>
<div class="text-on-surface text-xs font-mono">W 118.2437°</div>
<div class="text-on-surface text-xs font-mono text-gold-highlight mt-1">Z +142.38m</div>
</div>
</div>
<!-- AR Overlays (Simulated in 2D space for layout) -->
<!-- Stake 1 -->
<div class="ar-stake top-[40%] left-[30%] z-30">
<div class="flex flex-col items-center">
<!-- Data Chip -->
<div class="bg-surface-dim border border-gold-highlight px-2 py-1 rounded text-gold-highlight font-technical-data text-technical-data text-[10px] whitespace-nowrap mb-1">
                    C-1: FFE +1.2m
                </div>
<!-- Anchor point -->
<div class="w-3 h-3 bg-gold-highlight rounded-full border-2 border-surface shadow-[0_0_10px_rgba(251,191,36,0.8)]"></div>
<div class="w-px h-16 bg-gradient-to-b from-gold-highlight to-transparent"></div>
</div>
</div>
<!-- Stake 2 -->
<div class="ar-stake top-[60%] left-[65%] z-30">
<div class="flex flex-col items-center">
<div class="bg-surface-dim border border-gold-highlight px-2 py-1 rounded text-gold-highlight font-technical-data text-technical-data text-[10px] whitespace-nowrap mb-1">
                    C-2: FFE +1.2m
                </div>
<div class="w-3 h-3 bg-gold-highlight rounded-full border-2 border-surface shadow-[0_0_10px_rgba(251,191,36,0.8)]"></div>
<div class="w-px h-16 bg-gradient-to-b from-gold-highlight to-transparent"></div>
</div>
</div>
<!-- Subsurface Utility Ghosting -->
<div class="absolute top-[50%] left-[20%] w-[60%] h-12 subsurface-ghost -rotate-12 z-20 flex items-center justify-center">
<span class="font-technical-data text-technical-data text-signal-blue text-[10px] tracking-widest bg-surface-dim/80 px-2 rounded">
                ELEC MAIN DEPTH -0.8m
            </span>
</div>
<!-- Bottom Status Rail & Action -->
<div class="absolute bottom-[72px] left-0 w-full px-4 pb-2 z-40 flex justify-between items-end pointer-events-none">
<!-- System Status -->
<div class="glass-hud rounded px-3 py-2 pointer-events-auto">
<div class="flex items-center gap-2">
<div class="w-2 h-2 rounded-full bg-signal-blue animate-pulse"></div>
<span class="font-technical-data text-technical-data text-[10px] text-on-surface">LIDAR ACTIVE</span>
</div>
</div>
<!-- Primary Action FAB (Contextual for Capture) -->
<button class="bg-gold-highlight text-on-primary rounded-full w-14 h-14 flex items-center justify-center shadow-lg pointer-events-auto hover:scale-105 active:scale-95 transition-transform border-2 border-surface">
<span class="material-symbols-outlined text-[28px]" data-icon="add_location">add_location</span>
</button>
</div>
<!-- Bottom Nav Bar (Shared Component) -->
<nav class="fixed bottom-0 w-full z-50 flex justify-around items-center px-4 py-2 glass-hud rounded-t-xl border-t border-outline-variant dark:border-outline shadow-md">
<!-- Capture (Active) -->
<a class="flex flex-col items-center justify-center bg-primary text-on-primary rounded-full p-2 transition-transform duration-150 ease-in-out w-16 h-12" href="#">
<span class="material-symbols-outlined text-[20px]" data-icon="photo_camera" data-weight="fill">photo_camera</span>
<span class="font-label-caps text-[9px] mt-1 hidden">Capture</span> <!-- Label hidden in this design for pure icon look, relying on shape -->
</a>
<!-- Measure (Inactive) -->
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-transform duration-150 ease-in-out w-16 h-12" href="#">
<span class="material-symbols-outlined text-[24px]" data-icon="straighten">straighten</span>
<span class="font-label-caps text-[9px] mt-1 hidden">Measure</span>
</a>
<!-- Trace (Inactive) -->
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-transform duration-150 ease-in-out w-16 h-12" href="#">
<span class="material-symbols-outlined text-[24px]" data-icon="draw">draw</span>
<span class="font-label-caps text-[9px] mt-1 hidden">Trace</span>
</a>
<!-- Assets (Inactive) -->
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-transform duration-150 ease-in-out w-16 h-12" href="#">
<span class="material-symbols-outlined text-[24px]" data-icon="potted_plant">potted_plant</span>
<span class="font-label-caps text-[9px] mt-1 hidden">Assets</span>
</a>
<!-- Cost (Inactive) -->
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-transform duration-150 ease-in-out w-16 h-12" href="#">
<span class="material-symbols-outlined text-[24px]" data-icon="payments">payments</span>
<span class="font-label-caps text-[9px] mt-1 hidden">Cost</span>
</a>
</nav>
</main>
</body></html>
