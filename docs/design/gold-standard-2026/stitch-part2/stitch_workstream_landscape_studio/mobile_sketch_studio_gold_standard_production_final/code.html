<!DOCTYPE html>

<html class="h-full" lang="en" style=""><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Mobile Sketch Studio - Workstream</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=JetBrains+Mono:wght@500&amp;family=Space+Grotesk:wght@500;700&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-error": "#ffffff",
                        "surface-container-low": "#eff4ff",
                        "surface-container-high": "#dce9ff",
                        "on-primary": "#ffffff",
                        "outline-variant": "#c3c6d7",
                        "background": "#f8f9ff",
                        "on-tertiary-fixed-variant": "#005226",
                        "surface-dim": "#cbdbf5",
                        "tertiary-fixed-dim": "#8bd79b",
                        "on-secondary-fixed-variant": "#93000b",
                        "tertiary": "#116231",
                        "outline": "#737686",
                        "on-tertiary-fixed": "#00210b",
                        "tertiary-fixed": "#a6f4b5",
                        "surface-container-highest": "#d3e4fe",
                        "primary-container": "#2563eb",
                        "on-surface-variant": "#434655",
                        "inverse-surface": "#213145",
                        "on-secondary-container": "#fffbff",
                        "primary": "#004ac6",
                        "surface-variant": "#d3e4fe",
                        "on-error-container": "#93000a",
                        "secondary": "#bb0112",
                        "inverse-primary": "#b4c5ff",
                        "secondary-fixed": "#ffdad6",
                        "on-tertiary": "#ffffff",
                        "secondary-container": "#e02928",
                        "inverse-on-surface": "#eaf1ff",
                        "error": "#ba1a1a",
                        "surface": "#f8f9ff",
                        "primary-fixed-dim": "#b4c5ff",
                        "on-tertiary-container": "#c2ffca",
                        "surface-bright": "#f8f9ff",
                        "surface-container-lowest": "#ffffff",
                        "on-secondary-fixed": "#410002",
                        "on-secondary": "#ffffff",
                        "primary-fixed": "#dbe1ff",
                        "on-primary-fixed": "#00174b",
                        "tertiary-container": "#307b47",
                        "on-background": "#0b1c30",
                        "error-container": "#ffdad6",
                        "on-primary-container": "#eeefff",
                        "secondary-fixed-dim": "#ffb4ab",
                        "on-surface": "#0b1c30",
                        "surface-container": "#e5eeff",
                        "surface-tint": "#0053db",
                        "on-primary-fixed-variant": "#003ea8",
                        "gold-standard": "#fbbf24"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "panel-width": "280px",
                        "gutter": "12px",
                        "toolbar-height": "48px",
                        "margin": "16px",
                        "unit": "4px"
                    },
                    "fontFamily": {
                        "label-mono": ["JetBrains Mono"],
                        "body-md": ["Inter"],
                        "body-sm": ["Inter"],
                        "headline-sm": ["Inter"],
                        "label-caps": ["Inter"],
                        "tech": ["Space Grotesk"]
                    },
                    "fontSize": {
                        "label-mono": ["12px", { "lineHeight": "16px", "letterSpacing": "-0.02em", "fontWeight": "500" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "body-sm": ["12px", { "lineHeight": "16px", "fontWeight": "400" }],
                        "headline-sm": ["18px", { "lineHeight": "24px", "fontWeight": "600" }],
                        "label-caps": ["11px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700" }],
                        "tech-sm": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                        "tech-md": ["14px", { "lineHeight": "20px", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        /* Blueprint grid background */
        .blueprint-grid {
            background-image: 
                linear-gradient(to right, rgba(0, 74, 198, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 74, 198, 0.05) 1px, transparent 1px),
                linear-gradient(to right, rgba(0, 74, 198, 0.1) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 74, 198, 0.1) 1px, transparent 1px);
            background-size: 20px 20px, 20px 20px, 100px 100px, 100px 100px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-surface text-on-surface h-full flex flex-col overflow-hidden font-body-md select-none touch-none dark">
<!-- Main Workspace (Full Bleed) -->
<main class="flex-1 absolute inset-0 overflow-hidden flex">
<!-- Canvas Area -->
<div class="flex-1 relative bg-surface-container-lowest blueprint-grid overflow-hidden cursor-crosshair">
<!-- Canvas Content (Simulated SVG/Drawings) -->
<div class="absolute inset-0 flex items-center justify-center transform scale-[1.2] origin-center opacity-80">
<svg class="w-full h-full" height="600" viewbox="0 0 800 600" width="800">
<!-- Existing Elements (Crimson #bb0112) -->
<path class="opacity-50" d="M 100 100 L 700 100 L 700 500 L 100 500 Z" fill="none" stroke="#bb0112" stroke-dasharray="10 5" stroke-width="2"></path>
<rect fill="none" height="120" stroke="#bb0112" stroke-width="3" width="150" x="200" y="150"></rect>
<text class="font-tech text-tech-sm opacity-75" fill="#bb0112" x="210" y="170">EXISTING_DWL</text>
<path class="opacity-40" d="M 500 200 C 600 250, 650 350, 550 450" fill="none" stroke="#bb0112" stroke-dasharray="4 4" stroke-width="1.5"></path>
<!-- Proposed Massing (Cobalt/Primary #2563eb / #004ac6) -->
<path class="opacity-80" d="M 200 350 Q 300 300, 400 400 T 600 350" fill="none" stroke="#2563eb" stroke-linecap="round" stroke-width="12"></path>
<path class="opacity-50" d="M 220 370 Q 300 320, 390 420 T 580 370" fill="none" stroke="#004ac6" stroke-width="2"></path>
<circle class="opacity-40" cx="280" cy="420" fill="#2563eb" r="30"></circle>
<circle class="opacity-30" cx="330" cy="450" fill="#2563eb" r="40"></circle>
<circle class="opacity-50" cx="250" cy="470" fill="#2563eb" r="25"></circle>
<text class="font-tech text-tech-sm font-bold" fill="#004ac6" x="350" y="380">PROP_PATH_01</text>
<!-- AI Ghost Suggestion -->
<g class="animate-pulse">
<circle class="opacity-60" cx="500" cy="300" fill="none" r="45" stroke="#307b47" stroke-dasharray="6 4" stroke-width="2"></circle>
<circle class="opacity-60" cx="540" cy="330" fill="none" r="35" stroke="#307b47" stroke-dasharray="6 4" stroke-width="2"></circle>
<text class="font-tech text-[10px] opacity-80" fill="#307b47" x="470" y="280">AI_PLANT_CLUSTER</text>
</g>
</svg>
</div>
<!-- AI Suggestion Accept/Reject Floating UI -->
<div class="absolute top-[40%] left-[60%] transform -translate-x-1/2 -translate-y-1/2 flex gap-1 bg-surface-dim/70 rounded-full p-1 shadow-lg border border-outline-variant/30 z-10 backdrop-blur-md">
<button class="w-8 h-8 rounded-full bg-surface flex items-center justify-center text-error hover:bg-error-container transition-colors shadow-sm">
<span class="material-symbols-outlined text-[18px]">close</span>
</button>
<button class="w-8 h-8 rounded-full bg-primary flex items-center justify-center text-on-primary hover:bg-primary-container transition-colors shadow-sm">
<span class="material-symbols-outlined text-[18px]">check</span>
</button>
</div>
<!-- Strike Alert Spatial Annotation -->
<div class="absolute top-[25%] left-[65%] transform -translate-x-1/2 -translate-y-1/2 flex items-center gap-2 bg-error/90 backdrop-blur-md rounded-lg px-2 py-1 shadow-lg border border-error-container z-20">
<span class="material-symbols-outlined text-[16px] text-on-error">warning</span>
<span class="font-tech text-tech-sm text-on-error font-bold tracking-widest">UTILITY CONFLICT</span>
</div>
<!-- Staking Chip Spatial Annotation -->
<div class="absolute top-[65%] left-[30%] transform -translate-x-1/2 -translate-y-1/2 flex flex-col items-center gap-1 z-20">
<div class="bg-gold-standard text-black rounded-full px-2 py-0.5 shadow-md border border-black/10 font-tech text-[10px] font-bold">STK-01</div>
<div class="w-1 h-6 bg-gold-standard"></div>
<div class="w-2 h-2 rounded-full bg-gold-standard border-2 border-white"></div>
</div>
<!-- Staking Chip Spatial Annotation 2 -->
<div class="absolute top-[55%] left-[75%] transform -translate-x-1/2 -translate-y-1/2 flex flex-col items-center gap-1 z-20">
<div class="bg-gold-standard text-black rounded-full px-2 py-0.5 shadow-md border border-black/10 font-tech text-[10px] font-bold">STK-02</div>
<div class="w-1 h-6 bg-gold-standard"></div>
<div class="w-2 h-2 rounded-full bg-gold-standard border-2 border-white"></div>
</div>
<!-- Floating Top Glass Header Context Overlay -->
<div class="absolute top-margin left-margin right-margin bg-surface-dim/70 backdrop-blur-md rounded-2xl px-4 py-3 border border-outline-variant/30 shadow-md z-30 flex justify-between items-center">
<div class="flex flex-col gap-0.5">
<div class="font-label-caps text-[10px] text-on-surface-variant opacity-70 flex items-center gap-1">
<span class="w-2 h-2 rounded-full bg-gold-standard"></span>
PROJECT
</div>
<div class="font-body-sm font-bold text-on-surface text-lg">Oak Ridge Estate</div>
</div>
<div class="flex items-center gap-4">
<div class="flex flex-col items-end">
<div class="font-tech text-tech-sm text-primary">SCALE 1:100</div>
<div class="font-tech text-[10px] text-on-surface-variant">42.3601° N, 71.0589° W</div>
</div>
<button class="p-2 text-on-surface-variant bg-surface/50 rounded-full hover:text-primary backdrop-blur-md">
<span class="material-symbols-outlined">more_vert</span>
</button>
</div>
</div>
</div>
<!-- Floating Tool Dock (Right Side) -->
<div class="absolute right-margin top-1/2 transform -translate-y-1/2 rounded-2xl flex flex-col gap-2 p-2 z-40 bg-surface-dim/70 backdrop-blur-md border border-outline-variant/30 shadow-lg">
<button class="w-10 h-10 rounded-xl bg-surface-sunken flex items-center justify-center text-gold-standard border-l-2 border-gold-standard transition-colors bg-gold-standard/10" title="Ink">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">draw</span>
</button>
<button class="w-10 h-10 rounded-xl hover:bg-surface-container-highest flex items-center justify-center text-on-surface-variant transition-colors" title="Erase">
<span class="material-symbols-outlined">ink_eraser</span>
</button>
<div class="w-8 h-[1px] bg-outline-variant mx-auto my-1"></div>
<button class="w-10 h-10 rounded-xl hover:bg-surface-container-highest flex items-center justify-center text-on-surface-variant transition-colors" title="Trace">
<span class="material-symbols-outlined">layers</span>
</button>
<button class="w-10 h-10 rounded-xl hover:bg-surface-container-highest flex items-center justify-center text-on-surface-variant transition-colors" title="Measure">
<span class="material-symbols-outlined">straighten</span>
</button>
<div class="w-8 h-[1px] bg-outline-variant mx-auto my-1"></div>
<button class="w-10 h-10 rounded-xl hover:bg-surface-container-highest flex items-center justify-center text-on-surface-variant transition-colors" title="Add Asset">
<span class="material-symbols-outlined">potted_plant</span>
</button>
</div>
</main>
<!-- BottomNavBar (Mobile specific navigation shell) -> Floating Glass Footer -->
<nav class="fixed left-margin right-margin bottom-margin flex justify-around items-center bg-surface-dim/70 backdrop-blur-md border border-outline-variant/30 shadow-xl rounded-2xl p-2 z-50">
<button class="w-12 h-12 flex flex-col items-center justify-center text-on-surface-variant hover:text-gold-standard transition-all rounded-xl hover:bg-surface-container-highest" title="Capture">
<span class="material-symbols-outlined">photo_camera</span>
</button>
<button class="w-12 h-12 flex flex-col items-center justify-center text-on-surface-variant hover:text-gold-standard transition-all rounded-xl hover:bg-surface-container-highest" title="Measure">
<span class="material-symbols-outlined">straighten</span>
</button>
<button class="w-14 h-14 flex items-center justify-center bg-gold-standard text-black rounded-full transition-transform active:scale-90 shadow-lg -mt-6 border-4 border-surface" title="Sketch">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">edit_note</span>
</button>
<button class="w-12 h-12 flex flex-col items-center justify-center text-on-surface-variant hover:text-gold-standard transition-all rounded-xl hover:bg-surface-container-highest" title="Assets">
<span class="material-symbols-outlined">potted_plant</span>
</button>
<div class="flex flex-col items-center justify-center px-2">
<span class="font-label-caps text-[9px] text-on-surface-variant">EST</span>
<span class="font-tech text-tech-md font-bold text-primary">$12.4k</span>
</div>
</nav>
</body></html>
