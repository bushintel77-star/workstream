<style>
        /* Craft-First Drafting Paper Grid */
        .bg-grid-dots {
            background-color: #faf9f5;
            background-image: radial-gradient(#d5d4d0 1px, transparent 1px);
            background-size: 20px 20px;
            background-position: -10px -10px;
        }
        
        /* Architectural Sketch Lines */
        .boundary-line {
            stroke: #2c2e2a;
            stroke-width: 1.5;
            stroke-dasharray: 12 6 4 6;
            fill: none;
            stroke-linecap: round;
        }
        .house-structure {
            fill: none;
            stroke: #171916;
            stroke-width: 2.5;
            stroke-linecap: square;
        }
        /* Hand-stippled texture for house */
        .house-hatch {
            stroke: #949590;
            stroke-width: 0.5;
            stroke-dasharray: 1 3;
        }
        .proposed-path {
            stroke: #454842;
            stroke-width: 1;
            stroke-dasharray: 4 2;
            fill: none;
        }
        /* Bespoke Planting Texture */
        .planting-cluster {
            fill: none;
            stroke: #59614f;
            stroke-width: 1.5;
            stroke-linecap: round;
        }
        .planting-stipple {
            fill: #767872;
        }
        .service-line {
            stroke: #d97706; /* Subtle Gold/Amber */
            stroke-width: 1;
            stroke-dasharray: 8 4;
            fill: none;
        }
        
        /* High-quality Stationery UI */
        .ui-panel {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid #e3e2df;
            box-shadow: 0 4px 20px rgba(44, 46, 42, 0.05), 0 1px 3px rgba(44, 46, 42, 0.02);
            border-radius: 0.5rem;
        }
    </style>
</head>
<body class="bg-background text-on-surface overflow-hidden min-h-screen w-full relative font-body-md text-body-md m-0 p-0">
<!-- Main Canvas Area -->
<main class="absolute inset-0 bg-grid-dots z-0 w-full h-full overflow-hidden">

<!-- Site Origin Anchor -->
<g transform="translate(100, 700)">
<circle cx="0" cy="0" fill="none" r="16" stroke="#767872" stroke-width="1"></circle>
<circle cx="0" cy="0" fill="#454842" r="3"></circle>
<line stroke="#767872" stroke-width="1" x1="-24" x2="24" y1="0" y2="0"></line>
<line stroke="#767872" stroke-width="1" x1="0" x2="0" y1="-24" y2="24"></line>
</g>
<!-- Boundary -->
<polygon class="boundary-line" points="200,150 800,100 900,600 150,700"></polygon>
<!-- Existing House (Architectural Sketch Style) -->
<rect class="house-structure" height="180" width="250" x="350" y="250"></rect>
<!-- Diagonal Hatching for House -->
<path class="house-hatch" d="M360,250 L350,260 M380,250 L350,280 M400,250 L350,300 M420,250 L350,320 M440,250 L350,340 M460,250 L350,360 M480,250 L350,380 M500,250 L350,400 M520,250 L350,420 M540,250 L360,430 M560,250 L380,430 M580,250 L400,430 M600,250 L420,430 M600,270 L440,430 M600,290 L460,430 M600,310 L480,430 M600,330 L500,430 M600,350 L520,430 M600,370 L540,430 M600,390 L560,430 M600,410 L580,430"></path>
<rect class="house-structure" height="50" width="100" x="400" y="430"></rect>
<!-- Proposed Path -->
<path class="proposed-path" d="M450,480 Q450,600 300,650 T150,700"></path>
<path class="proposed-path" d="M460,480 Q460,610 310,660 T160,710" style="stroke-width: 0.5; stroke-dasharray: 2 4;"></path>
<!-- Planting Clusters (Hand-drawn feel) -->
<g transform="translate(250, 300)">
<circle class="planting-cluster" cx="0" cy="0" r="40" stroke-dasharray="8 3 4 3"></circle>
<circle class="planting-stipple" cx="-10" cy="-15" r="1"></circle>
<circle class="planting-stipple" cx="15" cy="-5" r="1.5"></circle>
<circle class="planting-stipple" cx="-5" cy="20" r="1"></circle>
<circle class="planting-stipple" cx="20" cy="10" r="1"></circle>
<circle class="planting-stipple" cx="0" cy="5" r="1.5"></circle>
</g>

</g>

<line class="service-line" x1="700" x2="600" y1="200" y2="400"></line>

<circle cx="650" cy="300" fill="#d97706" r="3"></circle>
<circle cx="650" cy="300" fill="none" r="8" stroke="#d97706" stroke-width="1"></circle>
</svg>
<!-- Site Origin Floating Tag -->
<div class="absolute" style="top: 720px; left: 120px;">

</div>
