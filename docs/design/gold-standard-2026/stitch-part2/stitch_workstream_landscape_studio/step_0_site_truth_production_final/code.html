<style>/* Base styles mapped to tailwind classes in config */
body {
    @apply bg-background text-on-surface font-body-md;
    overflow: hidden
    }
.glass-panel {
    @apply bg-surface-dim/70 backdrop-blur-md border border-on-surface/10;
    }
.input-focus-ring {
    @apply focus: outline-none focus: ring-1 focus: ring-gold-highlight focus: border-transparent;
    }
/* Map Background Simulation */
.map-bg {
    background-image: url(https://lh3.googleusercontent.com/aida-public/AB6AXuA-ma621ukpB_pajKdwkuKEz3gEacMxnvqHEj3kmFZEViCB0y4O4oR6v5wDKGe-CgqDOvmCR3wXT-FxUaECB3mHmQplaK_6iZlJUrFeZdiKppo6Oo1-6Ur0CV5B8KIvHAv2Q6pEtxpgidGdotG3vzMiKaxV5B_N9QV6oUvX-tSmMCJjqnfAnFTrKefSEX4V_PqH4wDLd_MFZHL39RIqQ4_owWiq7oN0E8Vw0-hy-RHOhKUkTg4jzsbTPg);
    background-size: cover;
    background-position: center
    }
/* Crosshair */
.crosshair::before, .crosshair::after {
    content: "";
    position: absolute;
    background-color: #0030CF;
    /* Signal Blue */
    }
.crosshair::before {
    width: 100%;
    height: 1px;
    top: 50%;
    left: 0;
    transform: translatey(-50%)
    }
.crosshair::after {
    height: 100%;
    width: 1px;
    left: 50%;
    top: 0;
    transform: translatex(-50%)
    }</style>
</head>
<body class="relative w-screen h-screen">
<!-- Full Bleed Map Background -->
<div class="absolute inset-0 w-full h-full map-bg" data-alt="A high-resolution, full-bleed satellite view of a suburban residential property in Armadale, Australia. The image is hyper-detailed, showcasing intricate rooflines, lush green landscape elements, and precise property boundaries. The lighting is crisp and technical, evoking a professional CAD or GIS software environment in a Studio Dark theme, with deep shadows and sharp contrast. The aesthetic is strictly utilitarian and authoritative, suitable for landscape architecture analysis." data-location="Armadale" style="">
<!-- Overlay to ensure text readability if needed, though strictly it's a map view -->
<div class="absolute inset-0 bg-surface/20"></div>
</div>
<!-- Signal Blue Origin Crosshair -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-8 h-8 crosshair pointer-events-none z-10 opacity-80"></div>
<!-- Meta Chips (Left Lane) -->
<div class="absolute left-margin-safe top-1/2 -translate-y-1/2 flex flex-col gap-unit z-20">
<div class="glass-panel px-4 py-2 rounded flex items-center gap-2">
<span class="w-2 h-2 rounded-full bg-gold-highlight"></span>
<span class="font-technical-data text-technical-data text-on-surface uppercase tracking-wider">Parcel Boundary (Verified)</span>
</div>
<div class="glass-panel px-4 py-2 rounded flex items-center gap-2">
<span class="w-2 h-2 rounded-full bg-signal-blue"></span>
<span class="font-technical-data text-technical-data text-on-surface uppercase tracking-wider">VicMap (Synced)</span>
</div>
<div class="glass-panel px-4 py-2 rounded flex items-center gap-2 opacity-50">
<span class="w-2 h-2 rounded-full bg-on-surface"></span>
<span class="font-technical-data text-technical-data text-on-surface uppercase tracking-wider">Title (Secured)</span>
</div>
</div>
<!-- Floating Centered Search HUD -->
<div class="absolute top-1/4 left-1/2 -translate-x-1/2 z-30 w-full max-w-md">
<div class="glass-panel rounded-lg p-2 shadow-2xl flex items-center group focus-within:ring-1 focus-within:ring-gold-highlight transition-shadow">
<span class="material-symbols-outlined text-on-surface-variant ml-3" data-icon="search">search</span>
<input autofocus="" class="w-full bg-transparent border-none text-on-surface font-technical-data text-technical-data placeholder-on-surface-variant/50 focus:ring-0 px-4 py-3" placeholder="Enter Coordinates or Address..." type="text"/>
<button class="bg-surface-variant hover:bg-surface-container-highest text-on-surface px-4 py-2 rounded transition-colors font-technical-data text-technical-data border border-on-surface/10">
                LOCATE
            </button>
</div>
<!-- Search Results / Suggestions Dropdown (Hidden by default, shown for UI context) -->
<div class="mt-2 glass-panel rounded-lg overflow-hidden hidden group-focus-within:block opacity-0 group-focus-within:opacity-100 transition-opacity duration-200">
<ul class="font-technical-data text-technical-data text-on-surface divide-y divide-on-surface/10">
<li class="px-4 py-3 hover:bg-on-surface/5 cursor-pointer flex items-center justify-between">
<span>-37.857, 145.021</span>
<span class="text-on-surface-variant text-[10px]">ARMADALE</span>
</li>
<li class="px-4 py-3 hover:bg-on-surface/5 cursor-pointer flex items-center justify-between">
<span>42 Kooyong Rd</span>
<span class="text-on-surface-variant text-[10px]">RESIDENTIAL</span>
</li>
</ul>
</div>
</div>
<!-- Status Rail (Persistent bottom edge) -->

<div class="flex items-center gap-6">
<span class="font-technical-data text-[11px] text-on-surface-variant tracking-widest uppercase">LAT -37.857321</span>
<span class="font-technical-data text-[11px] text-on-surface-variant tracking-widest uppercase">LNG 145.021589</span>
<span class="font-technical-data text-[11px] text-on-surface-variant tracking-widest uppercase">ELEV 42M</span>
</div>
<div class="flex items-center gap-4">
<span class="w-2 h-2 rounded-full bg-signal-blue animate-pulse"></span>
<span class="font-technical-data text-[11px] text-on-surface-variant tracking-widest uppercase">SYSTEM ACTIVE</span>
</div>
