<style>
        body {
            background-color: #101418; /* surface container */
            margin: 0;
            overflow: hidden;
            overscroll-behavior-y: none;
        }
        /* Custom HUD Glitch/Scanline FX */
        .scanlines {
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.1) 50%,
                rgba(0,0,0,0.1)
            );
            background-size: 100% 4px;
            pointer-events: none;
        }
        .ar-glow-blue { filter: drop-shadow(0 0 12px rgba(182, 237, 255, 0.6)); }
        .ar-glow-red { filter: drop-shadow(0 0 12px rgba(255, 180, 171, 0.6)); }
        .ar-glow-gold { filter: drop-shadow(0 0 12px rgba(251, 191, 36, 0.6)); }
        
        .hud-glass {
            background: rgba(30, 35, 41, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(224, 227, 232, 0.1);
        }
        
        .pulse-dot {
            animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0; }
            100% { transform: scale(0.8); opacity: 0; }
        }
    </style>
