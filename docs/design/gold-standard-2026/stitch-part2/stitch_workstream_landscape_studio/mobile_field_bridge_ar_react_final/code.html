<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Mobile Field Bridge AR Companion</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@500;600&amp;family=Space+Grotesk:wght@600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container": "#1c2024",
                        "secondary-fixed-dim": "#bac3ff",
                        "primary-fixed": "#ffdf9f",
                        "background": "#101418",
                        "on-secondary-fixed": "#00105b",
                        "surface-container-low": "#181c20",
                        "surface": "#101418",
                        "on-tertiary-fixed": "#001f27",
                        "surface-variant": "#31353a",
                        "on-primary-container": "#6c4f00",
                        "on-secondary": "#001f90",
                        "secondary-fixed": "#dee0ff",
                        "error-container": "#93000a",
                        "surface-container-highest": "#31353a",
                        "outline": "#9c8f79",
                        "on-surface": "#e0e3e8",
                        "on-error": "#690005",
                        "on-secondary-fixed-variant": "#002eca",
                        "on-primary-fixed-variant": "#5c4300",
                        "on-tertiary": "#003641",
                        "inverse-primary": "#795900",
                        "primary-container": "#fbbf24",
                        "tertiary-container": "#34daff",
                        "on-tertiary-fixed-variant": "#004e5d",
                        "primary-fixed-dim": "#f9bd22",
                        "tertiary": "#b6edff",
                        "signal-blue": "#0030CF",
                        "cloud-mist": "#D7E1EC",
                        "on-secondary-container": "#a8b4ff",
                        "surface-container-lowest": "#0b0f12",
                        "gold-highlight": "#FBBF24",
                        "on-surface-variant": "#d3c5ac",
                        "error": "#ffb4ab",
                        "inverse-surface": "#e0e3e8",
                        "tertiary-fixed": "#afecff",
                        "secondary-container": "#0130cf",
                        "surface-container-high": "#262a2f",
                        "on-primary-fixed": "#261a00",
                        "outline-variant": "#4f4633",
                        "surface-bright": "#363a3e",
                        "on-tertiary-container": "#005c6e",
                        "secondary": "#bac3ff",
                        "on-error-container": "#ffdad6",
                        "inverse-on-surface": "#2d3135",
                        "primary": "#ffe1a7",
                        "on-primary": "#402d00",
                        "surface-dim": "#101418",
                        "surface-tint": "#f9bd22",
                        "on-background": "#e0e3e8",
                        "tertiary-fixed-dim": "#30d8fd"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "unit": "4px",
                        "toolbar-width": "56px",
                        "gutter": "16px",
                        "margin-safe": "32px",
                        "sidebar-width": "280px"
                    },
                    "fontFamily": {
                        "technical-data": ["JetBrains Mono"],
                        "headline-lg": ["Space Grotesk"],
                        "display-lg": ["Space Grotesk"],
                        "label-caps": ["JetBrains Mono"],
                        "headline-lg-mobile": ["Space Grotesk"],
                        "body-md": ["Inter"]
                    },
                    "fontSize": {
                        "technical-data": ["13px", { "lineHeight": "18px", "letterSpacing": "0.02em", "fontWeight": "500" }],
                        "headline-lg": ["32px", { "lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                        "display-lg": ["48px", { "lineHeight": "52px", "letterSpacing": "-0.03em", "fontWeight": "700" }],
                        "label-caps": ["11px", { "lineHeight": "16px", "letterSpacing": "0.08em", "fontWeight": "600" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "body-md": ["15px", { "lineHeight": "24px", "letterSpacing": "-0.01em", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        
        .ar-grid {
            background-image: 
                linear-gradient(to right, rgba(0, 48, 207, 0.2) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 48, 207, 0.2) 1px, transparent 1px);
            background-size: 40px 40px;
            transform: perspective(500px) rotateX(60deg) translateY(-100px) scale(2);
            transform-origin: top center;
        }

        .hud-glass {
            background: rgba(16, 20, 24, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(224, 227, 232, 0.1);
        }

        .chip-glow {
            box-shadow: 0 0 15px rgba(251, 191, 36, 0.5), inset 0 0 10px rgba(251, 191, 36, 0.8);
        }
        
        /* Specific TopAppBar adjustments for transparent AR view */
        .ar-top-bar {
            background: transparent !important;
            border-bottom: none !important;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="text-on-surface antialiased">
<!-- Camera Background Placeholder -->
<div class="absolute inset-0 z-0">
<div class="bg-cover bg-center w-full h-full" data-alt="A high-resolution, realistic mobile phone camera view pointing at a suburban backyard with green grass, a wooden fence, and a small shed. The lighting is bright daytime sunlight. This serves as the background for an Augmented Reality interface." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCT06zakkRiIl9sa5ja1_jlLfgwE9TYtlA2kenvWWlotw5Casn9oKpv2WW_kVNppcMEVIvhLJiQtHxrVSAOMLDp2s7tUk_1A7y1ZyNFpeIgYq3GbtLGo-HD0-jgHT6onsemGSd96-6gKa-Gbe9V1LbDS4jGRdSlnqSD24gaqovAux4WfkfbxdoG4MYzANXy-F1jzZ3F0zEi3OSHBJZ4E7maQcBacRXddYoKpTc6ooSIt_WxHOboDKiE1w')"></div>
</div>
<!-- Simulated AR Elements Overlay -->
<div class="absolute inset-0 z-10 overflow-hidden pointer-events-none flex flex-col justify-end items-center pb-32">
<!-- Perspective Grid -->
<div class="absolute inset-0 ar-grid z-0"></div>
<!-- AR Chips -->
<div class="relative w-full h-full z-10 perspective-1000">
<!-- Chip 1 -->
<div class="absolute top-[40%] left-[30%] transform -translate-x-1/2 -translate-y-1/2 flex flex-col items-center">
<div class="bg-surface-dim/70 backdrop-blur-md border border-outline-variant px-2 py-1 rounded mb-2 flex items-center gap-1">
<span class="font-technical-data text-technical-data text-on-surface">W-101</span>
</div>
<div class="w-12 h-12 bg-primary-container rounded-full chip-glow border-2 border-primary-fixed transform rotateX-45"></div>
<div class="w-0.5 h-24 bg-gradient-to-b from-primary-container to-transparent mt-1"></div>
</div>
<!-- Chip 2 -->
<div class="absolute top-[35%] right-[20%] transform -translate-x-1/2 -translate-y-1/2 flex flex-col items-center">
<div class="bg-surface-dim/70 backdrop-blur-md border border-outline-variant px-2 py-1 rounded mb-2 flex items-center gap-1">
<span class="font-technical-data text-technical-data text-on-surface">E-202</span>
</div>
<div class="w-10 h-10 bg-primary-container rounded-full chip-glow border-2 border-primary-fixed transform rotateX-45"></div>
<div class="w-0.5 h-16 bg-gradient-to-b from-primary-container to-transparent mt-1"></div>
</div>
<!-- Chip 3 (Foreground) -->
<div class="absolute bottom-[40%] left-[40%] transform -translate-x-1/2 -translate-y-1/2 flex flex-col items-center scale-150">
<div class="bg-surface-dim/70 backdrop-blur-md border border-outline-variant px-3 py-1 rounded-lg mb-3 flex items-center gap-1">
<span class="font-technical-data text-[15px] font-bold text-on-surface">W-101</span>
</div>
<div class="w-16 h-16 bg-primary-container rounded-full chip-glow border-4 border-primary-fixed transform rotateX-45 shadow-[0_10px_20px_rgba(251,191,36,0.4)]"></div>
<div class="w-1 h-32 bg-gradient-to-b from-primary-container to-transparent mt-2"></div>
</div>
</div>
</div>
<!-- UI Overlay Layer -->
<div class="absolute inset-0 z-20 flex flex-col justify-between pointer-events-none">
<!-- Top Controls (Safe Area) -->
<div class="w-full pt-margin-safe px-4 flex justify-between items-start pointer-events-auto">
<!-- Back Button -->
<button class="w-12 h-12 rounded-full hud-glass flex items-center justify-center text-on-surface hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined" data-icon="chevron_left">chevron_left</span>
</button>
<!-- RTK Status Pill -->
<div class="hud-glass rounded-full px-6 py-2 border border-gold-highlight flex items-center gap-2">
<div class="w-2 h-2 rounded-full bg-gold-highlight animate-pulse"></div>
<span class="font-technical-data text-technical-data text-gold-highlight tracking-widest font-bold">RTK FIXED</span>
</div>
<!-- Settings Button -->
<button class="w-12 h-12 rounded-full hud-glass flex items-center justify-center text-on-surface hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
</button>
</div>
<!-- Bottom Area Controls -->
<div class="w-full flex flex-col items-end px-4 pb-4 pointer-events-auto">
<!-- Floating Settings Action -->
<div class="w-full flex justify-between items-end mb-4">
<button class="w-14 h-14 rounded-full hud-glass flex items-center justify-center text-on-surface hover:bg-surface-container-high transition-colors shadow-lg">
<span class="material-symbols-outlined text-[28px]" data-icon="settings">settings</span>
</button>
<!-- Debug HUD Panel -->
<div class="hud-glass p-3 rounded-lg border border-outline-variant/30 min-w-[200px]">
<div class="font-technical-data text-label-caps text-on-surface-variant mb-1 border-b border-outline-variant/30 pb-1">Developer debug</div>
<table class="w-full font-technical-data text-[10px] text-on-surface opacity-80">
<tbody><tr><td class="py-0.5">coordinates:</td><td class="text-right">-7.749.039</td></tr>
<tr><td class="py-0.5">crd:</td><td class="text-right">-3.736.8972</td></tr>
<tr><td class="py-0.5">ntw:</td><td class="text-right">-3.397.9373</td></tr>
<tr><td class="py-0.5">Network:</td><td class="text-right">4/3</td></tr>
<tr><td class="py-0.5">vato:</td><td class="text-right">0.56</td></tr>
<tr><td class="py-0.5">stats:</td><td class="text-right">0.30</td></tr>
</tbody></table>
</div>
</div>
<!-- Main Mode Selector HUD -->
<div class="w-full bg-surface-container-lowest/90 backdrop-blur-xl rounded-2xl p-2 pb-6 border-t border-outline-variant/50 shadow-2xl">
<!-- Handle -->
<div class="w-12 h-1 bg-outline-variant rounded-full mx-auto mb-4"></div>
<div class="hud-glass rounded-xl p-1 flex justify-between items-stretch h-14">
<button class="flex-1 font-body-md text-on-surface-variant rounded-lg hover:bg-surface-container/50 transition-colors">
                        Survey
                    </button>
<button class="flex-1 font-body-md text-gold-highlight font-medium border border-gold-highlight/50 bg-gold-highlight/10 rounded-lg shadow-[inset_0_0_10px_rgba(251,191,36,0.1)]">
                        Staking
                    </button>
<button class="flex-1 font-body-md text-on-surface-variant rounded-lg hover:bg-surface-container/50 transition-colors">
                        Subsurface
                    </button>
</div>
</div>
</div>
</div>
</body></html>
