<body class="bg-background text-on-surface h-screen w-screen overflow-hidden flex font-body-md relative">

<p class="font-technical-data text-technical-data text-on-surface-variant mt-1">ID: BLD-024-X • REV B</p>
</div>
<div class="p-6 flex flex-col gap-6 overflow-y-auto">
<!-- Export Setup -->
<div class="flex flex-col gap-4">
<h3 class="font-label-caps text-label-caps text-on-surface-variant uppercase">Lenses to Include</h3>
<div class="flex flex-col gap-3">
<label class="flex items-center gap-3 cursor-pointer group">
<div class="relative flex items-center justify-center">
<input checked="" class="peer sr-only" type="checkbox"/>
<div class="w-5 h-5 border border-outline rounded bg-surface peer-checked:bg-primary-container peer-checked:border-primary-container transition-colors"></div>
<span class="material-symbols-outlined text-[14px] text-on-primary-container absolute opacity-0 peer-checked:opacity-100 transition-opacity pointer-events-none">check</span>
</div>

</label>
<label class="flex items-center gap-3 cursor-pointer group">

<span class="material-symbols-outlined text-[14px] text-on-primary-container absolute opacity-0 peer-checked:opacity-100 transition-opacity pointer-events-none">check</span>
</div>
<span class="font-body-md text-body-md group-hover:text-primary transition-colors">Subsurface Utilities</span>
</label>
<label class="flex items-center gap-3 cursor-pointer group">
<div class="relative flex items-center justify-center">
<input checked="" class="peer sr-only" type="checkbox"/>

<span class="material-symbols-outlined text-[14px] text-on-primary-container absolute opacity-0 peer-checked:opacity-100 transition-opacity pointer-events-none">check</span>
</div>
<span class="font-body-md text-body-md group-hover:text-primary transition-colors">Planting Schedule</span>
</label>
<label class="flex items-center gap-3 cursor-pointer group">
<div class="relative flex items-center justify-center">
<input class="peer sr-only" type="checkbox"/>
<div class="w-5 h-5 border border-outline rounded bg-surface peer-checked:bg-primary-container peer-checked:border-primary-container transition-colors"></div>
<span class="material-symbols-outlined text-[14px] text-on-primary-container absolute opacity-0 peer-checked:opacity-100 transition-opacity pointer-events-none">check</span>
</div>
<span class="font-body-md text-body-md group-hover:text-primary transition-colors">Drainage Analysis</span>

</div>

<option>CAD (DWG)</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">expand_more</span>

<div class="w-6 h-6 rounded bg-surface flex items-center justify-center text-on-surface-variant">
