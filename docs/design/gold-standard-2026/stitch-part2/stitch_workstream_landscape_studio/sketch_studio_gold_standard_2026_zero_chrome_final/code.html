<style>

            background-size: 64px 64px, 16px 16px;
            background-position: -32px -32px, -8px -8px;
        }

        .boundary-line {
            stroke: #e0e3e8;
            stroke-width: 1.5;
            stroke-dasharray: 8 6;
            fill: none;
        }
        .house-structure {
            fill: transparent;
            stroke: #e0e3e8;
            stroke-width: 1;
        }
        .proposed-path {
            stroke: #0030CF;
            stroke-width: 3;
            stroke-linecap: round;
            fill: none;
        }
        .planting-cluster {
            fill: rgba(168, 255, 180, 0.15);
            stroke: rgba(168, 255, 180, 0.6);
            stroke-width: 1.5;
        }
        .service-line {
            stroke: #FBBF24;
            stroke-width: 1.5;
