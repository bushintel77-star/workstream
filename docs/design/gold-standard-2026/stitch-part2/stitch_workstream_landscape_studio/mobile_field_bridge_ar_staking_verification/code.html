<!DOCTYPE html>

<title>Field Bridge Verification</title>
<!-- Google Fonts: Space Grotesk, Inter, JetBrains Mono -->

<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Theme Configuration -->
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-primary-fixed-variant": "#5c4300",

                    "surface-container": "#1c2024",
                    "surface": "#101418",
                    "primary-container": "#fbbf24",
                    "inverse-surface": "#e0e3e8",
                    "on-surface": "#e0e3e8",
                    "on-error": "#690005",
                    "inverse-primary": "#795900",
                    "on-secondary": "#001f90",
                    "primary-fixed-dim": "#f9bd22",
                    "on-secondary-container": "#a8b4ff",
                    "error": "#ffb4ab",
                    "surface-container-highest": "#31353a",
                    "primary-fixed": "#ffdf9f",
                    "primary": "#ffe1a7",
                    "tertiary": "#b6edff",
                    "background": "#101418",
                    "on-secondary-fixed": "#00105b",
                    "on-tertiary": "#003641",
                    "on-tertiary-fixed-variant": "#004e5d",
                    "on-primary-fixed": "#261a00",
                    "inverse-on-surface": "#2d3135",
                    "surface-container-lowest": "#0b0f12",
                    "secondary-container": "#0130cf",
                    "on-error-container": "#ffdad6",
                    "cloud-mist": "#D7E1EC",
                    "outline": "#9c8f79",
                    "tertiary-fixed": "#afecff",
                    "error-container": "#93000a",
                    "surface-container-low": "#181c20",
                    "outline-variant": "#4f4633",
                    "on-primary-container": "#6c4f00",
                    "on-surface-variant": "#d3c5ac",
                    "on-secondary-fixed-variant": "#002eca",
                    "on-background": "#e0e3e8",
                    "signal-blue": "#0030CF",
                    "on-primary": "#402d00",
                    "secondary-fixed": "#dee0ff",
                    "on-tertiary-fixed": "#001f27",
                    "surface-tint": "#f9bd22",
                    "surface-container-high": "#262a2f",
                    "surface-variant": "#31353a",
                    "secondary-fixed-dim": "#bac3ff"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "spacing": {
                    "unit": "4px",
                    "gutter": "16px",
                    "margin-safe": "32px",
                    "sidebar-width": "280px",
                    "toolbar-width": "56px"
            },
            "fontFamily": {
                    "display-lg": ["Space Grotesk"],
                    "headline-lg": ["Space Grotesk"],
                    "headline-lg-mobile": ["Space Grotesk"],
                    "body-md": ["Inter"],
                    "label-caps": ["JetBrains Mono"],
                    "technical-data": ["JetBrains Mono"]
            },
            "fontSize": {
                    "display-lg": ["48px", { "lineHeight": "52px", "letterSpacing": "-0.03em", "fontWeight": "700" }],
                    "headline-lg": ["32px", { "lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                    "headline-lg-mobile": ["24px", { "lineHeight": "28px", "fontWeight": "600" }],
                    "body-md": ["15px", { "lineHeight": "24px", "letterSpacing": "-0.01em", "fontWeight": "400" }],

                    "technical-data": ["13px", { "lineHeight": "18px", "letterSpacing": "0.02em", "fontWeight": "500" }]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Pulse Animation for Staking Chip */
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.8; }
            100% { transform: scale(2.5); opacity: 0; }
        }
        .animate-pulse-ring {
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface h-screen w-screen overflow-hidden relative antialiased">
<!-- AR Camera Feed Background (Simulated) -->
<div class="absolute inset-0 w-full h-full z-0">
<img class="w-full h-full object-cover opacity-80" data-alt="A first-person augmented reality view of a complex urban construction site in Los Angeles at dusk. The camera feed shows exposed dirt trenches, concrete foundational forms, and rebar structures under cool, high-key ambient lighting. The mood is highly technical and precise, acting as a realistic dark-mode canvas for a digital HUD overlay. The environment is sharp, gritty, and utilitarian." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDvGx_y4cCl6ZCNU5WNy7xscwk8cBECZJeC7MxpsnpO9yrc7E9yJ0haeHnGJdjvwuLZiWM-ftqSzZEReQy-lQHvEQH0HZzj_eGo31DYTVK1O2EwsdXLscOfQwcDxrgOtPD96iKDHsx57kmbZ-ohTRPK5Qf9pcr2FE9dAWuJSQ9tYjkA1bdcejOKTeRZey2mJiAhD0TGwNZl6UXZkU2XBzUVWtTfcfi-m_JlY9As5DuBcWC1FRH-ZYKXwA"/>
<!-- Subtle gradient overlay to ensure UI contrast -->
<div class="absolute inset-0 bg-gradient-to-b from-surface/40 via-transparent to-surface/80"></div>
</div>
<!-- Top HUD Navigation (Transactional - Zero Chrome) -->
<header class="absolute top-0 left-0 w-full z-50 p-gutter flex justify-between items-start pointer-events-none">
<!-- Close Button -->
<button class="pointer-events-auto flex items-center justify-center w-10 h-10 rounded-full bg-surface-dim/70 backdrop-blur-md border border-outline-variant hover:bg-surface-container-high transition-colors text-on-surface">
<span class="material-symbols-outlined text-[20px]" data-icon="close">close</span>
</button>
<!-- Status Indicator -->
<div class="pointer-events-auto flex items-center gap-2 bg-surface-dim/70 backdrop-blur-md border border-outline-variant rounded-full px-3 py-1.5">
<div class="w-2 h-2 rounded-full bg-tertiary-container animate-pulse"></div>
<span class="font-label-caps text-label-caps text-tertiary-container">RTK FIX</span>
</div>
</header>
<!-- Center Reticle / Staking Chip Group -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-20 flex flex-col items-center">
<!-- Staking Chip (Gold Standard Highlight) -->
<div class="relative flex items-center justify-center">
<!-- Pulsing Rings -->
<div class="absolute inset-0 rounded-full border-2 border-gold-highlight animate-pulse-ring"></div>
<div class="absolute inset-0 rounded-full border-2 border-gold-highlight animate-pulse-ring" style="animation-delay: 1s;"></div>
<!-- Core Chip -->
<div class="w-8 h-8 rounded-full bg-gold-highlight/20 border-2 border-gold-highlight flex items-center justify-center shadow-[0_0_15px_rgba(251,191,36,0.5)] backdrop-blur-sm z-10">
<div class="w-2 h-2 bg-gold-highlight rounded-full"></div>
</div>
<!-- Crosshairs -->
<div class="absolute w-[120px] h-[1px] bg-gold-highlight/30 pointer-events-none"></div>
<div class="absolute h-[120px] w-[1px] bg-gold-highlight/30 pointer-events-none"></div>
</div>
<!-- Anchored Spatial Fact Chip (Glass Card) -->
<div class="mt-4 bg-surface-dim/70 backdrop-blur-md border border-outline-variant rounded-lg p-3 min-w-[180px] shadow-lg pointer-events-auto">
<div class="flex items-center gap-2 mb-2 pb-2 border-b border-outline/20">
<span class="material-symbols-outlined text-gold-highlight text-[16px]" data-icon="my_location" data-weight="fill" style="font-variation-settings: 'FILL' 1;">my_location</span>
<span class="font-label-caps text-label-caps text-gold-highlight uppercase tracking-wider">Spatial Fact</span>
</div>
<div class="flex flex-col gap-1">
<div class="flex justify-between items-center">
<span class="font-technical-data text-technical-data text-on-surface-variant">Coordinate</span>
<span class="font-technical-data text-technical-data text-on-surface font-semibold">Locked</span>
</div>
<div class="flex justify-between items-center">
<span class="font-technical-data text-technical-data text-on-surface-variant">Accuracy</span>
<span class="font-technical-data text-technical-data text-tertiary-container font-semibold">&lt;12mm</span>
</div>
<div class="flex justify-between items-center mt-1 pt-1 border-t border-outline/10">
<span class="font-technical-data text-technical-data text-on-surface-variant text-[11px]">E: 384912.44</span>
<span class="font-technical-data text-technical-data text-on-surface-variant text-[11px]">N: 482910.11</span>
</div>
</div>
</div>
<!-- Leader Line (Connecting chip to target roughly) -->
<div class="absolute top-8 w-[1px] h-4 bg-outline-variant/50"></div>
</div>
<!-- Contextual Actions (Floating Right) -->
<div class="absolute right-gutter top-1/2 -translate-y-1/2 flex flex-col gap-3 z-30 pointer-events-auto">
<button class="w-12 h-12 rounded-full bg-surface-dim/70 backdrop-blur-md border border-outline-variant flex items-center justify-center text-on-surface hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined" data-icon="layers">layers</span>
</button>
<button class="w-12 h-12 rounded-full bg-surface-dim/70 backdrop-blur-md border border-outline-variant flex items-center justify-center text-on-surface hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined" data-icon="straighten">straighten</span>
</button>
<button class="w-12 h-12 rounded-full bg-gold-highlight text-on-primary-fixed-variant flex items-center justify-center shadow-lg hover:scale-105 transition-transform">
<span class="material-symbols-outlined" data-icon="camera" data-weight="fill" style="font-variation-settings: 'FILL' 1;">camera</span>
</button>
</div>
<!-- Strike Alert HUD (Slim Semantic Red Bar) -->
<div class="absolute bottom-margin-safe left-gutter right-gutter z-40 pointer-events-auto">
<div class="bg-error-container/90 backdrop-blur-md border border-error rounded-lg p-3 shadow-[0_4px_24px_rgba(255,180,171,0.15)] flex items-center gap-4 relative overflow-hidden">
<!-- Warning Stripes Background -->
<div class="absolute inset-0 opacity-10" style="background-image: repeating-linear-gradient(45deg, transparent, transparent 10px, #690005 10px, #690005 20px);"></div>
<!-- Icon -->
<div class="w-10 h-10 rounded-full bg-error/20 flex items-center justify-center z-10 shrink-0">
<span class="material-symbols-outlined text-error" data-icon="warning" data-weight="fill" style="font-variation-settings: 'FILL' 1;">warning</span>
</div>
<!-- Alert Content -->
<div class="flex-1 z-10">
<div class="font-label-caps text-label-caps text-error mb-0.5">STRIKE ALERT</div>
<div class="font-technical-data text-technical-data text-on-error-container font-semibold">
                    Subsurface Utility: Gas Main (600mm Depth)
                </div>
</div>
</div>
</div>
</body></html>
