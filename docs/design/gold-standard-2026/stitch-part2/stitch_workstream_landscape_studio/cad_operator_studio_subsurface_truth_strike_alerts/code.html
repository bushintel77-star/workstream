<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>

<title>CAD Operator Studio - Subsurface Truth</title>

                      "surface": "#101418",
                      "on-error-container": "#ffdad6",
                      "primary-fixed-dim": "#f9bd22",
                      "on-tertiary-container": "#005c6e",
                      "inverse-primary": "#795900",
                      "tertiary-container": "#34daff",
                      "background": "#101418",
                      "error": "#ffb4ab",
                      "surface-dim": "#101418",
                      "tertiary-fixed-dim": "#30d8fd",
                      "signal-blue": "#0030CF",
                      "surface-tint": "#f9bd22",
                      "surface-container-low": "#181c20",
                      "surface-container-lowest": "#0b0f12",
                      "on-tertiary-fixed": "#001f27",
                      "on-surface": "#e0e3e8",
                      "on-surface-variant": "#d3c5ac",
                      "secondary-fixed-dim": "#bac3ff",
                      "secondary": "#bac3ff",
                      "primary-container": "#fbbf24",
                      "inverse-surface": "#e0e3e8",
                      "secondary-fixed": "#dee0ff",
                      "inverse-on-surface": "#2d3135",

                      "sidebar-width": "280px",
                      "gutter": "16px",
                      "toolbar-width": "56px",
                      "margin-safe": "32px"
              },
              "fontFamily": {

                      "display-lg": [

                      "technical-data": [

          }

<style>
        .glass-panel {
            background: linear-gradient(135deg, rgba(16,20,24,0.8) 0%, rgba(16,20,24,0.6) 100%);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(224, 227, 232, 0.1);
        }
        .bg-grid-pattern {
            background-size: 32px 32px;
            background-image: 
                linear-gradient(to right, rgba(224, 227, 232, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(224, 227, 232, 0.03) 1px, transparent 1px);
        }
        .pulse-alert {
            animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.8; }
            100% { transform: scale(2.5); opacity: 0; }
        }
    </style>
</head>
<body class="bg-surface text-on-surface overflow-hidden w-full h-screen relative font-body-md text-body-md select-none">
<!-- Background Canvas (Simulating 3D CAD Environment) -->
<div class="absolute inset-0 w-full h-full bg-surface-lowest z-0">
<div class="w-full h-full bg-cover bg-center opacity-40 mix-blend-screen" data-alt="A sophisticated, high-precision 3D CAD visualization of an urban site parcel tilted in isometric view. Underground utility lines (gas, water, electrical) are rendered as translucent, glowing geometric volumes (ghost geometry) beneath the surface grid. The scene is set in a dark 'Studio Dark' environment with charcoal backgrounds, illuminated by subtle technical gradients and a striking semantic red intersection point indicating a strike alert. Hyper-realistic professional engineering aesthetic." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuApoF8aRinknhYjBXpBxc_IkpNm-K8eQ6r6BfwKVRuDSjrVOwBMcm40fDE49MLk4_mw4U3mJb8i0415RMCVJnqw563OujSizK1pj2uwMowyNJueRmdE0UprSgOyLzVEiPULzb3POyc2Y50J9JjxKMU1eo2FcGR44FYL46GM56FKG8zp5bs9CHepoZeDVVnCjwwTx5BvdDidtGRTusxREgh5rDgGbyJBn9OJ5CanZmi9HdKKqB_d-ZSrBQ')"></div>
<div class="absolute inset-0 bg-grid-pattern z-0 pointer-events-none"></div>
</div>
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-gutter h-toolbar-width bg-surface-dim/70 backdrop-blur-md border-b border-on-surface/10 flat no shadows">
<div class="flex items-center gap-4">
<span class="font-display-lg text-headline-lg-mobile text-on-surface tracking-tight">CAD Operator Studio</span>
</div>
<div class="flex items-center gap-2 bg-surface-container/50 border border-on-surface/10 rounded-full px-4 py-1.5 focus-within:border-signal-blue transition-colors">
<span class="material-symbols-outlined text-on-surface-variant text-[18px]">search</span>
<input class="bg-transparent border-none focus:ring-0 text-technical-data font-technical-data text-on-surface placeholder:text-on-surface-variant/50 w-64 outline-none" placeholder="Search coordinates, layers..." type="text"/>
</div>
<div class="flex items-center gap-4">
<button class="text-on-surface-variant hover:bg-on-surface/5 transition-colors p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined">settings</span>
</button>
<button class="text-on-surface-variant hover:bg-on-surface/5 transition-colors p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined">account_circle</span>
</button>
</div>
</header>
<!-- SideNavBar -->
<nav class="fixed left-4 top-1/2 -translate-y-1/2 rounded-full w-14 py-4 z-50 flex flex-col items-center gap-4 bg-surface-dim/70 backdrop-blur-md border border-on-surface/10 flat no shadows">
<div class="flex flex-col items-center gap-1 mb-2">
<span class="font-label-caps text-label-caps text-on-surface tracking-widest text-[8px] rotate-180" style="writing-mode: vertical-rl;">TOOLSET</span>
</div>
<button class="text-on-surface-variant p-2 hover:text-gold-highlight transition-all flex flex-col items-center group" title="Select">
<span class="material-symbols-outlined group-hover:scale-110 transition-transform">near_me</span>
</button>
<button class="text-on-surface-variant p-2 hover:text-gold-highlight transition-all flex flex-col items-center group" title="Draw">
<span class="material-symbols-outlined group-hover:scale-110 transition-transform">edit</span>
</button>
<button class="text-on-surface-variant p-2 hover:text-gold-highlight transition-all flex flex-col items-center group" title="Geometry">
<span class="material-symbols-outlined group-hover:scale-110 transition-transform">category</span>
</button>
<!-- Active Tab: Analyze (Due to Strike Alert context) -->
<button class="bg-gold-highlight text-on-primary-fixed rounded-full p-2 scale-110 transition-all duration-200 shadow-[0_0_15px_rgba(251,191,36,0.3)]" title="Analyze">
<span class="material-symbols-outlined">troubleshoot</span>
</button>
<button class="text-on-surface-variant p-2 hover:text-gold-highlight transition-all flex flex-col items-center group mt-2" title="System">
<span class="material-symbols-outlined group-hover:scale-110 transition-transform">settings</span>
</button>
<div class="mt-4 pt-4 border-t border-on-surface/10 w-8 flex justify-center">
<span class="font-label-caps text-[8px] text-on-surface-variant/50 rotate-180" style="writing-mode: vertical-rl;">V2.0.4</span>
</div>
</nav>
<!-- Canvas Interactions / HUD Layer -->
<main class="absolute inset-0 pt-toolbar-width pl-[80px] w-full h-full z-10 pointer-events-none">
<!-- Strike Alert Reticle & HUD -->
<div class="absolute top-[45%] left-[55%] -translate-x-1/2 -translate-y-1/2 pointer-events-auto flex flex-col items-center">
<!-- Reticle -->
<div class="relative flex items-center justify-center mb-6">
<div class="absolute w-32 h-32 rounded-full border border-red-500/30 pulse-alert"></div>
<div class="w-12 h-12 rounded-full border-2 border-red-500 flex items-center justify-center bg-red-500/10 backdrop-blur-sm relative z-10">
<div class="w-2 h-2 bg-red-500 rounded-full shadow-[0_0_10px_#ef4444]"></div>
</div>
<!-- Coordinate Lines -->
<div class="absolute w-[200px] h-[1px] bg-red-500/40 pointer-events-none"></div>
<div class="absolute h-[200px] w-[1px] bg-red-500/40 pointer-events-none"></div>
</div>
<!-- Strike Alert Modal -->
<div class="glass-panel border-red-500/30 rounded-lg p-4 w-80 shadow-2xl backdrop-blur-xl bg-surface-lowest/90 relative overflow-hidden">
<div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-red-500 to-transparent"></div>
<div class="flex items-center gap-3 mb-3">
<span class="material-symbols-outlined text-red-500" style="font-variation-settings: 'FILL' 1;">warning</span>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-red-500 tracking-tight uppercase text-lg">Strike Alert</h2>
</div>
<div class="space-y-3 font-technical-data text-technical-data text-on-surface-variant">
<div class="flex justify-between border-b border-on-surface/5 pb-1">
<span class="text-on-surface/50">Vector:</span>
<span class="text-on-surface text-right">Z-Intersect (Gas Main)</span>
</div>
<div class="flex justify-between border-b border-on-surface/5 pb-1">
<span class="text-on-surface/50">Delta:</span>
<span class="text-red-400 text-right">-12mm Tolerance</span>
</div>
<div class="flex justify-between pt-1">
<span class="text-on-surface/50">Action:</span>
<span class="text-gold-highlight text-right animate-pulse">Relocate Post 14</span>
</div>
</div>
<div class="mt-4 flex gap-2">
<button class="flex-1 bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/30 py-1.5 rounded text-technical-data font-technical-data transition-colors">Abort Path</button>
<button class="flex-1 glass-panel hover:bg-on-surface/5 text-on-surface py-1.5 rounded text-technical-data font-technical-data transition-colors">Details</button>
</div>
</div>
</div>
<!-- Telemetry Meta Chips (Billboarded) -->
<div class="absolute top-[30%] left-[25%] pointer-events-auto">
<div class="glass-panel rounded-full px-3 py-1.5 flex items-center gap-2 shadow-lg border-signal-blue/30">
<div class="w-1.5 h-1.5 rounded-full bg-signal-blue animate-pulse"></div>
<span class="font-technical-data text-technical-data text-on-surface tracking-wide">Flow: 24.6 GPM</span>
</div>
<!-- Connector line simulation -->
<div class="w-px h-16 bg-gradient-to-b from-signal-blue/50 to-transparent ml-6 mt-1"></div>
</div>
<div class="absolute bottom-[25%] right-[20%] pointer-events-auto">
<div class="glass-panel rounded-full px-3 py-1.5 flex items-center gap-2 shadow-lg border-primary-container/30">
<div class="w-1.5 h-1.5 rounded-full bg-primary-container animate-pulse"></div>
<span class="font-technical-data text-technical-data text-on-surface tracking-wide">Pressure: 11.8 kPa</span>
</div>
</div>
<div class="absolute top-[60%] right-[35%] pointer-events-auto">
<div class="glass-panel rounded-full px-3 py-1.5 flex items-center gap-2 shadow-lg">
<div class="w-1.5 h-1.5 rounded-full bg-outline"></div>
<span class="font-technical-data text-technical-data text-on-surface tracking-wide">Depth: -1200mm</span>
</div>
</div>
<!-- Status Rail (Bottom) -->
<div class="absolute bottom-0 left-0 w-full h-8 glass-panel border-t border-on-surface/10 flex items-center justify-between px-gutter font-technical-data text-[10px] text-on-surface-variant/70 tracking-widest uppercase">
<div class="flex items-center gap-6">
<span>Coord: 34.0522° N, 118.2437° W</span>
<span>Elevation: +45.2m</span>
</div>
<div class="flex items-center gap-4">
<span class="flex items-center gap-1"><div class="w-2 h-2 rounded-full bg-green-500"></div> Sync Active</span>
<span>Layer: Underground Utilities V3</span>
</div>
</div>
</main>
</body></html>
