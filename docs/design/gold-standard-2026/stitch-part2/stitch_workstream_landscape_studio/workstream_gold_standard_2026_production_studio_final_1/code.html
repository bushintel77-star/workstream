<style>

            background-image: radial-gradient(rgba(224, 227, 232, 0.15) 1px, transparent 1px);
            background-size: 16px 16px;
            background-position: -8px -8px;
        }

        .boundary-line {
            stroke: #e0e3e8;
            stroke-width: 2;
            stroke-dasharray: 8 4;
            fill: none;
        }
        .house-structure {
            fill: rgba(30, 35, 41, 0.5);
            stroke: #e0e3e8;
            stroke-width: 1;
        }
        .proposed-path {
            stroke: #f8f9ff;
            stroke-width: 4;
            stroke-linecap: round;
            fill: none;
        }
        .planting-cluster {
            fill: rgba(139, 148, 158, 0.2);
            stroke: rgba(139, 148, 158, 0.8);
            stroke-width: 2;
        }

<body class="bg-[#101418] text-on-surface overflow-hidden min-h-screen w-full relative font-body-md text-body-md m-0 p-0">
<!-- Main Canvas Area -->
<main class="absolute inset-0 bg-grid-dots z-0 w-full h-full overflow-hidden">
<!-- SVG Canvas for Geometry -->
<svg class="w-full h-full absolute inset-0" xmlns="http://www.w3.org/2000/svg">

<g transform="translate(100, 700)">
<circle cx="0" cy="0" fill="none" r="16" stroke="#8b949e" stroke-width="2"></circle>
<circle cx="0" cy="0" fill="#8b949e" r="4"></circle>
<line stroke="#8b949e" stroke-width="2" x1="-24" x2="24" y1="0" y2="0"></line>
<line stroke="#8b949e" stroke-width="2" x1="0" x2="0" y1="-24" y2="24"></line>
</g>
<!-- Boundary -->
<polygon class="boundary-line" points="200,150 800,100 900,600 150,700"></polygon>
<!-- Existing House -->
<rect class="house-structure" height="180" width="250" x="350" y="250"></rect>
<rect class="house-structure" height="50" width="100" x="400" y="430"></rect>
<!-- Proposed Path -->
<path class="proposed-path" d="M450,480 Q450,600 300,650 T150,700"></path>

<circle class="planting-cluster" cx="250" cy="300" r="40"></circle>
<circle class="planting-cluster" cx="280" cy="340" r="30"></circle>
<circle class="planting-cluster" cx="220" cy="360" r="35"></circle>

<line class="service-line" x1="700" x2="600" y1="200" y2="400"></line>
<!-- Contextual Meta Chip Anchor point -->
<circle cx="650" cy="300" fill="#f8f9ff" r="4"></circle>
</svg>

<div class="absolute" style="top: 720px; left: 120px;">

<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-ux-grey text-[14px]" data-icon="lock">lock</span>
<span class="font-technical-data text-technical-data text-ux-grey uppercase">Site Origin (0,0,0)</span>
</div>
</div>
</div>
