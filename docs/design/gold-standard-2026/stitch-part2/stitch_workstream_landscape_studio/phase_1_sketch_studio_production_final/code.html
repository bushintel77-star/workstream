<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sketch Studio - Phase 1</title>

              "borderRadius": {
                      "DEFAULT": "0.125rem",
                      "lg": "0.25rem",
                      "xl": "0.5rem",
                      "full": "0.75rem"
              },
              "spacing": {
                      "gutter": "16px",
                      "sidebar-width": "280px",
                      "unit": "4px",
                      "margin-safe": "32px",
                      "toolbar-width": "56px"
              },
              "fontFamily": {
                      "body-md": [
                              "Inter"

                      "headline-lg-mobile": [

                      "technical-data": [

<style>
        .fractal-grid {
            background-image: radial-gradient(rgba(255, 255, 255, 0.1) 1px, transparent 1px);
            background-size: 32px 32px;
            background-position: 0 0, 16px 16px;
        }
        
        .glass-panel {
            background-color: rgba(16, 20, 24, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(224, 227, 232, 0.1);
        }

        /* Material Symbols Weight Setup */
        .material-symbols-outlined[data-weight="fill"] {
            font-variation-settings: 'FILL' 1;
        }
      </style>
</head>
<body class="bg-surface-dim text-on-surface overflow-hidden w-screen h-screen relative font-body-md">
<!-- Infinite Canvas / Dot Grid -->
<div class="absolute inset-0 fractal-grid z-0"></div>
<!-- Background Content (Simulated fluid geometry sketches) -->
<div class="absolute inset-0 z-0 opacity-40 pointer-events-none" data-alt="Abstract architectural fluid geometry sketches intersecting across a dark charcoal background. High-precision neon blue and gold lines trace organic forms representing urban development phases. The style is minimalist and highly technical, evocative of advanced CAD interfaces and holographic projections in a sophisticated 2026 studio environment. The lighting emphasizes the glowing wireframes against the deep dark canvas." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDkm8TlqqW6ivFEzmHdj4cPXZfOxKsUa5li3tgr1nx5jB_LFGi8SOTBxvvhA8I7Li-UaaxgB24NZ2sZvLKJJm80Chk6wuNGC1-ETilYP8yNXngtpaXXcsDdSWZGnYOIrm_urzOh-GCaOcIliJ9fKpekvudelq4ADEgqtxpfYuedVhcru4sAZQ-HkBxSgQL4yu2UV-6siaKlnIfb0bRpYhG_7qfZvOXTvNyR1XFxlynJA--jZpp4rpHbnA'); background-size: cover; background-position: center;"></div>
<!-- Top AppBar (from JSON) -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-gutter h-toolbar-width bg-surface-dim/70 backdrop-blur-md border-b border-on-surface/10 rounded-b-xl">
<div class="flex items-center gap-4">
<span class="font-display-lg text-headline-lg text-on-surface tracking-tight">CAD Operator Studio</span>
</div>
<div class="flex-1 flex justify-center max-w-md hidden md:flex">
<!-- Search Bar (on_left logic implemented but visually centered for balance, could move left) -->
<div class="relative w-full">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-sm">search</span>
<input class="w-full bg-surface-container/50 border border-on-surface/10 rounded-full py-1.5 pl-9 pr-4 text-technical-data font-technical-data focus:outline-none focus:border-gold-highlight text-on-surface placeholder-on-surface-variant transition-colors" placeholder="Search components..." type="text"/>
</div>
</div>
<div class="flex items-center gap-2">
<button class="p-2 text-on-surface-variant hover:bg-on-surface/5 transition-colors rounded-full flex items-center justify-center">
<span class="material-symbols-outlined">account_circle</span>
</button>
<button class="p-2 text-on-surface-variant hover:bg-on-surface/5 transition-colors rounded-full flex items-center justify-center">
<span class="material-symbols-outlined">settings</span>
</button>
</div>
</header>
<!-- SideNavBar (from JSON) -->
<nav class="fixed left-4 top-1/2 -translate-y-1/2 z-50 flex flex-col items-center gap-4 bg-surface-dim/70 backdrop-blur-md border border-on-surface/10 rounded-full w-14 py-4 hidden md:flex">
<!-- Header pseudo-element info, normally above nav but JSON structure asks for specific layout -->
<div class="hidden">
<span class="font-label-caps text-label-caps text-on-surface">TOOLSET</span>
<span class="font-technical-data text-technical-data text-on-surface-variant">V2.0.4</span>
</div>
<button class="text-on-surface-variant p-2 hover:text-gold-highlight transition-all" title="Select">
<span class="material-symbols-outlined">near_me</span>
</button>
<!-- Active Tab: Draw -->
<button class="bg-gold-highlight text-on-primary-fixed rounded-full p-2 scale-110 opacity-80 transition-all duration-200" title="Draw">
<span class="material-symbols-outlined" data-weight="fill">edit</span>
</button>
<button class="text-on-surface-variant p-2 hover:text-gold-highlight transition-all" title="Geometry">
<span class="material-symbols-outlined">category</span>
</button>
<button class="text-on-surface-variant p-2 hover:text-gold-highlight transition-all" title="Analyze">
<span class="material-symbols-outlined">troubleshoot</span>
</button>
<button class="text-on-surface-variant p-2 hover:text-gold-highlight transition-all" title="System">
<span class="material-symbols-outlined">settings</span>
</button>
</nav>
<!-- Main Canvas Area -->
<main class="w-full h-full pt-toolbar-width relative z-10">
<!-- Floating Lens Dial (Right side) -->
<div class="absolute right-gutter top-1/2 -translate-y-1/2 glass-panel rounded-2xl p-4 flex flex-col items-center gap-6 w-[80px]">
<div class="text-center w-full border-b border-on-surface/10 pb-2">
<span class="font-label-caps text-label-caps text-on-surface-variant block">LENS</span>
</div>
<!-- Simulated Dial -->
<div class="relative w-12 h-48 bg-surface-container-highest rounded-full flex flex-col items-center py-2 justify-between border border-on-surface/5">
<!-- Indicator line -->
<div class="absolute w-full h-[2px] bg-signal-blue top-[40%] z-20"></div>
<!-- Dial markers -->
<div class="w-4 h-[1px] bg-on-surface-variant/30"></div>
<div class="w-6 h-[1px] bg-on-surface-variant/50"></div>
<div class="w-8 h-[2px] bg-on-surface"></div>
<div class="w-6 h-[1px] bg-on-surface-variant/50"></div>
<div class="w-4 h-[1px] bg-on-surface-variant/30"></div>
<div class="w-4 h-[1px] bg-on-surface-variant/30"></div>
<div class="w-4 h-[1px] bg-on-surface-variant/30"></div>
</div>
<div class="text-center w-full mt-2">
<span class="font-technical-data text-technical-data text-signal-blue">24mm</span>
</div>
</div>
<!-- Temporal Scrubber (Bottom) -->
<div class="absolute bottom-margin-safe left-1/2 -translate-x-1/2 w-full max-w-3xl glass-panel rounded-xl p-4 px-6">
<div class="flex justify-between items-center mb-3">
<span class="font-label-caps text-label-caps text-gold-highlight tracking-widest">MATURITY MODEL</span>
<span class="font-technical-data text-technical-data text-on-surface">YEAR 3</span>
</div>
<div class="relative w-full h-2 bg-surface-container-highest rounded-full overflow-hidden">
<div class="absolute left-0 top-0 h-full bg-gold-highlight w-[30%]"></div>
</div>
<div class="flex justify-between mt-2 font-technical-data text-[10px] text-on-surface-variant">
<span>YR 0</span>
<span>YR 2</span>
<span class="text-on-surface font-bold">YR 4</span>
<span>YR 6</span>
<span>YR 8</span>
<span>YR 10</span>
</div>
</div>
</main>
</body></html>
