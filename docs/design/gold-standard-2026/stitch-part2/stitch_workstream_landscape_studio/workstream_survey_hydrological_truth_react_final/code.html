<style>
        body {
            background-color: #101418;
            color: #e0e3e8;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }
        
        /* Grid Canvas Background */
        .grid-canvas {
            background-size: 40px 40px;
            background-image: 
                linear-gradient(to right, rgba(0, 48, 207, 0.15) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 48, 207, 0.15) 1px, transparent 1px);
            position: absolute;
            inset: 0;
            z-index: 0;
        }

        /* Subtle Blueprint Line */
        .blueprint-line {
            position: absolute;
            height: 2px;
            background-color: rgba(52, 218, 255, 0.4);
            box-shadow: 0 0 8px rgba(52, 218, 255, 0.4);
            transform-origin: left center;
        }
        
        .blueprint-line-main {
            background-color: #34daff;
            box-shadow: 0 0 12px rgba(52, 218, 255, 0.6);
            height: 4px;
        }
        
        .blueprint-line-alert {
            background-color: #ef4444;
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.6);
            height: 4px;
        }

        /* 1px Leader Line */
        .leader-line {
            position: absolute;
            background-color: rgba(255, 255, 255, 0.4);
            height: 1px;
            transform-origin: left center;
            z-index: 10;
            pointer-events: none;
        }
        
        /* Pulse Animation for active nodes */
        @keyframes pulse-node {
            0% { transform: scale(1) translate(-50%, -50%); box-shadow: 0 0 0 0 rgba(52, 218, 255, 0.7); }
            70% { transform: scale(1.1) translate(-45%, -45%); box-shadow: 0 0 0 10px rgba(52, 218, 255, 0); }
            100% { transform: scale(1) translate(-50%, -50%); box-shadow: 0 0 0 0 rgba(52, 218, 255, 0); }
        }
        
        .node-active {
            animation: pulse-node 2s infinite;
        }
        
        @keyframes pulse-alert {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        
        .node-alert {
            animation: pulse-alert 1.5s infinite;
        }

        /* Hydraulic HUD Panel */
        .glass-hud {
            background-color: rgba(28, 32, 36, 0.75); /* surface-container with opacity */
            backdrop-filter: blur(16px);
            border: 1px solid rgba(156, 143, 121, 0.2); /* outline with opacity */
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
        }
        
        .text-flow-highlight { color: #34daff; } /* tertiary-container */
        
        /* Coordinate Marker (Crosshair) */
        .crosshair {
            position: absolute;
            width: 120px;
            height: 120px;
            bottom: 60px;
            left: 60px;
            z-index: 5;
        }
        
        .crosshair::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background-color: #0030CF;
        }
        
        .crosshair::after {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            width: 1px;
            background-color: #0030CF;
        }
        
        .crosshair-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 8px;
            height: 8px;
            background-color: #0030CF;
            border-radius: 50%;
            z-index: 6;
        }
    </style>
</head>
