<!DOCTYPE html>

<html class="h-full" lang="en" style=""><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Field Bridge AR</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=JetBrains+Mono:wght@500&amp;family=Space+Grotesk:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-error": "#ffffff",
                        "surface-container-low": "#eff4ff",
                        "surface-container-high": "#dce9ff",
                        "on-primary": "#ffffff",
                        "outline-variant": "#c3c6d7",
                        "background": "#f8f9ff",
                        "on-tertiary-fixed-variant": "#005226",
                        "surface-dim": "#cbdbf5",
                        "tertiary-fixed-dim": "#8bd79b",
                        "on-secondary-fixed-variant": "#93000b",
                        "tertiary": "#116231",
                        "outline": "#737686",
                        "on-tertiary-fixed": "#00210b",
                        "tertiary-fixed": "#a6f4b5",
                        "surface-container-highest": "#d3e4fe",
                        "primary-container": "#2563eb",
                        "on-surface-variant": "#434655",
                        "inverse-surface": "#213145",
                        "on-secondary-container": "#fffbff",
                        "primary": "#004ac6",
                        "surface-variant": "#d3e4fe",
                        "on-error-container": "#93000a",
                        "secondary": "#bb0112",
                        "inverse-primary": "#b4c5ff",
                        "secondary-fixed": "#ffdad6",
                        "on-tertiary": "#ffffff",
                        "secondary-container": "#e02928",
                        "inverse-on-surface": "#eaf1ff",
                        "error": "#ba1a1a",
                        "surface": "#f8f9ff",
                        "primary-fixed-dim": "#b4c5ff",
                        "on-tertiary-container": "#c2ffca",
                        "surface-bright": "#f8f9ff",
                        "surface-container-lowest": "#ffffff",
                        "on-secondary-fixed": "#410002",
                        "on-secondary": "#ffffff",
                        "primary-fixed": "#dbe1ff",
                        "on-primary-fixed": "#00174b",
                        "tertiary-container": "#307b47",
                        "on-background": "#0b1c30",
                        "error-container": "#ffdad6",
                        "on-primary-container": "#eeefff",
                        "secondary-fixed-dim": "#ffb4ab",
                        "on-surface": "#0b1c30",
                        "surface-container": "#e5eeff",
                        "surface-tint": "#0053db",
                        "on-primary-fixed-variant": "#003ea8",
                        "gold": "#fbbf24",
                        "gold-dim": "rgba(251, 191, 36, 0.2)",
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "panel-width": "280px",
                        "gutter": "12px",
                        "toolbar-height": "48px",
                        "margin": "16px",
                        "unit": "4px"
                    },
                    "fontFamily": {
                        "label-mono": ["JetBrains Mono"],
                        "body-md": ["Inter"],
                        "body-sm": ["Inter"],
                        "headline-sm": ["Inter"],
                        "label-caps": ["Inter"],
                        "space": ["Space Grotesk"]
                    },
                    "fontSize": {
                        "label-mono": ["12px", { "lineHeight": "16px", "letterSpacing": "-0.02em", "fontWeight": "500" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "body-sm": ["12px", { "lineHeight": "16px", "fontWeight": "400" }],
                        "headline-sm": ["18px", { "lineHeight": "24px", "fontWeight": "600" }],
                        "label-caps": ["11px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        /* Camera simulation / Dark grid background */
        .ar-grid {
            background-color: #0b1c30;
            background-image: 
                linear-gradient(to right, rgba(251, 191, 36, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(251, 191, 36, 0.05) 1px, transparent 1px),
                linear-gradient(to right, rgba(251, 191, 36, 0.1) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(251, 191, 36, 0.1) 1px, transparent 1px);
            background-size: 20px 20px, 20px 20px, 100px 100px, 100px 100px;
            box-shadow: inset 0 0 100px rgba(0,0,0,0.8);
        }
        
        .glass-panel {
            background: rgba(11, 28, 48, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-on-surface text-on-primary h-full flex flex-col overflow-hidden font-body-md select-none touch-none dark">
<!-- Main Workspace (AR Viewport) -->
<main class="flex-1 relative overflow-hidden flex ar-grid">
<!-- Canvas Area -->
<div class="flex-1 relative overflow-hidden cursor-crosshair">
<!-- Top Glass HUD -->
<div class="absolute top-margin left-margin right-margin z-50 flex justify-between items-start pointer-events-none">
<div class="glass-panel rounded-2xl p-3 flex flex-col gap-1 shadow-lg pointer-events-auto">
<div class="flex items-center gap-2">
<span class="w-2.5 h-2.5 rounded-full bg-gold shadow-[0_0_8px_rgba(251,191,36,0.8)] animate-pulse"></span>
<span class="font-space text-xs font-bold tracking-widest text-gold uppercase">RTK Fixed</span>
</div>
<div class="font-space text-sm text-white/90">
            N 35° 12' 44.2" <br/> W 80° 51' 12.8"
        </div>
<div class="font-space text-xs text-white/50 mt-1">
            Elev: 214.5m (±0.02m)
        </div>
</div>
<div class="glass-panel rounded-full p-2 flex items-center justify-center shadow-lg pointer-events-auto">
<button class="w-10 h-10 rounded-full flex items-center justify-center text-white/80 hover:text-gold transition-colors">
<span class="material-symbols-outlined">settings</span>
</button>
</div>
</div>
<!-- Canvas Content (Simulated AR Overlays) -->
<div class="absolute inset-0 flex items-center justify-center transform scale-[1.2] origin-center">
<svg class="w-full h-full" height="600" viewbox="0 0 800 600" width="800">
<!-- Staking Target 1 -->
<g transform="translate(300, 250)">
<circle class="opacity-20" cx="0" cy="0" fill="#fbbf24" r="60"></circle>
<circle class="opacity-40" cx="0" cy="0" fill="none" r="40" stroke="#fbbf24" stroke-width="1"></circle>
<circle cx="0" cy="0" fill="#fbbf24" r="4"></circle>
<path d="M 0 -15 L 0 15 M -15 0 L 15 0" stroke="#fbbf24" stroke-width="2"></path>
<line stroke="#fbbf24" stroke-dasharray="2 4" stroke-width="1" x1="0" x2="60" y1="0" y2="-40"></line>
</g>
<!-- Staking Target 2 -->
<g transform="translate(500, 400)">
<circle class="opacity-10" cx="0" cy="0" fill="#fbbf24" r="40"></circle>
<circle cx="0" cy="0" fill="#fbbf24" r="3"></circle>
<path d="M 0 -10 L 0 10 M -10 0 L 10 0" stroke="#fbbf24" stroke-width="1"></path>
</g>
<!-- Path Outline -->
<path class="opacity-60" d="M 100 450 Q 300 250, 500 400 T 700 300" fill="none" stroke="#fbbf24" stroke-dasharray="10 5" stroke-linecap="round" stroke-width="3"></path>
</svg>
</div>
<!-- AR Staking Chips (Floating HTML UI linked to physical coords) -->
<div class="absolute top-[40%] left-[35%] transform -translate-x-1/2 -translate-y-1/2 flex flex-col gap-1 z-10">
<div class="glass-panel px-3 py-1.5 rounded-full border border-gold/50 shadow-[0_0_15px_rgba(251,191,36,0.2)]">
<span class="font-space text-xs font-bold text-gold">STK-01</span>
</div>
<div class="glass-panel px-2 py-1 rounded bg-on-surface/80 flex items-center gap-1 self-start">
<span class="material-symbols-outlined text-[12px] text-white/70">arrow_downward</span>
<span class="font-space text-[10px] text-white">Cut 0.15m</span>
</div>
</div>
<div class="absolute top-[65%] left-[60%] transform -translate-x-1/2 -translate-y-1/2 flex flex-col gap-1 z-10">
<div class="glass-panel px-3 py-1.5 rounded-full border border-white/20">
<span class="font-space text-xs font-bold text-white/80">STK-02</span>
</div>
</div>
</div>
<!-- Floating Action Dock (Right Side) -->
<div class="absolute right-margin top-1/2 transform -translate-y-1/2 flex flex-col gap-2 z-20">
<button class="w-12 h-12 rounded-full glass-panel flex items-center justify-center text-white/80 hover:text-gold hover:border-gold/50 transition-all shadow-lg" title="Capture">
<span class="material-symbols-outlined">camera</span>
</button>
<button class="w-12 h-12 rounded-full glass-panel flex items-center justify-center text-white/80 hover:text-gold hover:border-gold/50 transition-all shadow-lg" title="Measure">
<span class="material-symbols-outlined">straighten</span>
</button>
<button class="w-12 h-12 rounded-full glass-panel flex items-center justify-center text-gold border-gold/50 bg-gold/10 transition-all shadow-[0_0_15px_rgba(251,191,36,0.2)]" title="Add Point">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">add_location</span>
</button>
</div>
<!-- Bottom Floating Tab Switcher -->
<div class="absolute bottom-margin left-1/2 transform -translate-x-1/2 z-50">
<div class="glass-panel rounded-full p-1.5 flex gap-1 shadow-2xl">
<button class="px-5 py-2.5 bg-white/10 text-white rounded-full font-space text-sm font-medium transition-all hover:bg-white/20">
            Survey
        </button>
<button class="px-5 py-2.5 bg-gold text-on-surface rounded-full font-space text-sm font-bold transition-all shadow-md">
            Staking
        </button>
<button class="px-5 py-2.5 text-white/60 hover:text-white rounded-full font-space text-sm font-medium transition-all hover:bg-white/10">
            Subsurface
        </button>
</div>
</div>
</main>
</body></html>
