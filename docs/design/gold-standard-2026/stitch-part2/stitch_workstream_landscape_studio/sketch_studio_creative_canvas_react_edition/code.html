<style>
        body {
            background-color: #101418;
            color: #e0e3e8;
            overflow: hidden; /* Prevent scrolling for canvas apps */
        }
        
        /* Grid pattern for the infinite canvas */
        .grid-pattern {
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 32px 32px;
        }

        /* Glassmorphism utility */
        .glass-panel {
            background: rgba(16, 20, 24, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(224, 227, 232, 0.1);
        }

        /* Connecting lines for chips */
        .chip-line {
            position: absolute;
            height: 1px;
            background-color: #FBBF24;
            transform-origin: left center;
        }
        .chip-dot {
            width: 4px;
            height: 4px;
            background-color: #FBBF24;
            border-radius: 50%;
            position: absolute;
        }
    </style>

<script>
        // Simple script to handle navigation active states for mockup interactivity
        document.querySelectorAll('nav.flex-col button').forEach(button => {
            button.addEventListener('click', function() {
                // Remove active classes from all
                document.querySelectorAll('nav.flex-col button').forEach(b => {
                    b.classList.remove('bg-gold-highlight', 'text-on-primary-fixed', 'scale-110', 'opacity-80');
                    b.classList.add('text-on-surface-variant');
                    const icon = b.querySelector('.material-symbols-outlined');
                    if(icon) icon.style.fontVariationSettings = "'FILL' 0";
                });
                
                // Add active classes to clicked
                this.classList.remove('text-on-surface-variant');
                this.classList.add('bg-gold-highlight', 'text-on-primary-fixed', 'scale-110', 'opacity-80');
                const icon = this.querySelector('.material-symbols-outlined');
                if(icon) icon.style.fontVariationSettings = "'FILL' 1";
            });
        });
    </script>
