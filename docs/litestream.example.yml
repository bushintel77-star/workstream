# Litestream config — replicate the Workstream JSON snapshot to S3-compatible
# object storage for disaster recovery.
#
# This file is documentation-first until the operator provisions Cloudflare R2
# or Backblaze B2 credentials and adds the Fly sidecar shown in
# docs/LITESTREAM-SETUP.md. Do not hardcode credentials here.

dbs:
  - path: /repo/apps/api/data/store.json
    replicas:
      - type: s3
        bucket: ${LITESTREAM_BUCKET}
        path: construct-api/store.json
        endpoint: ${LITESTREAM_S3_ENDPOINT}
        region: ${LITESTREAM_REGION}
        access-key-id: ${LITESTREAM_ACCESS_KEY_ID}
        secret-access-key: ${LITESTREAM_SECRET_ACCESS_KEY}
