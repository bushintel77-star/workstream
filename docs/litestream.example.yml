# Litestream configuration - SQLite-ready disaster recovery.
#
# Workstream currently persists to a JSON snapshot. Litestream replicates
# SQLite WAL files, not arbitrary JSON, so do not enable this sidecar until the
# SQLite migration creates the database path below. Do not hardcode credentials
# here.

dbs:
  - path: /repo/apps/api/data/workstream.sqlite
    replicas:
      - type: s3
        bucket: ${LITESTREAM_BUCKET}
        path: workstream-api/workstream.sqlite
        endpoint: ${LITESTREAM_S3_ENDPOINT}
        region: ${LITESTREAM_S3_REGION}
        access-key-id: ${LITESTREAM_ACCESS_KEY_ID}
        secret-access-key: ${LITESTREAM_SECRET_ACCESS_KEY}
