# Local production-like stack (build from monorepo root).
#   docker compose up --build
# Studio: http://localhost:3002  API: http://localhost:3001/healthz

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: "3001"
      PUBLIC_API_URL: http://localhost:3001
      CORS_ORIGIN: http://localhost:3002
      PORTAL_BASE_URL: http://localhost:3002
    volumes:
      - api-data:/repo/apps/api/data

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - "3002:3002"
    environment:
      NODE_ENV: production
      PORT: "3002"
      API_URL: http://api:3001
    depends_on:
      - api

volumes:
  api-data:
