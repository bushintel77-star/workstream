# Workstream — GitLab CI/CD
#
# Replaces the retired GitHub Actions workflow (.github/workflows/ci.yml and
# .github/workflows/gitleaks.yml). GitLab.com Free covers everything the old
# setup needed: private repos, branch protection rules, and shared-runner CI
# minutes. The authoritative gate remains `pnpm run ci` in the root
# package.json; the jobs below mirror it plus browser e2e and docker builds.

default:
  image: node:22
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store

variables:
  NEXT_PUBLIC_API_URL: "https://api-production-a8ff1.up.railway.app"

stages:
  - gate
  - scan
  - e2e
  - docker
  - deploy

# ---------------------------------------------------------------- gate
# Install (frozen lockfile) + every script gate + bundle-size web build +
# traceability + typecheck + lint + vitest. One job == `pnpm run ci`.
#
# Browser Playwright (including canvas-first-z-stack.spec.ts) is NOT part of
# this gate. R3F saturates GPU-less shared runners so locator.evaluate never
# gets a main-thread slot; raising timeouts only slows a red gate. The z-stack
# check stays as `pnpm web:check-canvas-first-zstack` for local runs and is
# covered by the non-blocking `e2e` job (`playwright test` shards the suite).
gate:
  stage: gate
  before_script:
    - corepack enable
    - corepack prepare pnpm@9.15.4 --activate
    - pnpm config set store-dir "$CI_PROJECT_DIR/.pnpm-store"
  script:
    - pnpm run ci
  # 30m: full Next.js production build for the bundle-size budget, typecheck,
  # lint and 1900+ vitest cases. Shared runners are slower than the local
  # wall clock; 30m keeps headroom without letting a genuine hang run long.
  timeout: 30m

# ---------------------------------------------------------------- scan
# gitleaks secret scan (parity with the old gitleaks GitHub Action).
# .gitleaks.toml extends the default rule set and allowlists two false
# positives: a test-mode Stripe webhook fixture (whsec_test_) and a
# PASTE_ placeholder in the Litestream setup doc.
secret-scan:
  stage: scan
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  script:
    - gitleaks detect --source "$CI_PROJECT_DIR" --config "$CI_PROJECT_DIR/.gitleaks.toml" --verbose
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# ---------------------------------------------------------------- e2e
# Playwright, sharded 3-way (includes canvas-first-z-stack.spec.ts).
# Non-blocking by design (2026-08-15): the suite passes locally but browser
# e2e on hosted runners is environment-flaky — especially WebGL/R3F.
e2e:
  stage: e2e
  needs: ["gate"]
  allow_failure: true
  parallel: 3
  before_script:
    - corepack enable
    - corepack prepare pnpm@9.15.4 --activate
    - pnpm config set store-dir "$CI_PROJECT_DIR/.pnpm-store"
    - pnpm install --frozen-lockfile
  script:
    - pnpm --filter @workstream/web exec playwright install chromium --with-deps
    - pnpm exec turbo run build --filter=@workstream/api...
    - pnpm --filter @workstream/web exec playwright test --shard="$CI_NODE_INDEX/$CI_NODE_TOTAL"
  variables:
    CI: "true"
    AUTH_REQUIRED: "false"
    API_URL: "http://127.0.0.1:3001"
    PLAYWRIGHT_BASE_URL: "http://127.0.0.1:3002"
    NEXT_PUBLIC_API_URL: "http://127.0.0.1:3001"
    PLAYWRIGHT_BROWSERS_PATH: "$CI_PROJECT_DIR/.playwright"
  # Job-level cache replaces default: cache, so restate .pnpm-store + lockfile key.
  # Persist browsers even when a shard fails (cache defaults to on_success).
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
      - .playwright
    when: always
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
      allow_failure: true
  timeout: 35m

# ---------------------------------------------------------------- docker
# Build-only image smoke (no push). Deploy stays on Railway.
build-api-image:
  stage: docker
  needs: ["gate"]
  image: docker:27
  services:
    - docker:27-dind
  before_script:
    - docker info
  script:
    - docker build -f apps/api/Dockerfile -t workstream-api:ci .
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
      allow_failure: true
  timeout: 15m

build-web-image:
  stage: docker
  needs: ["gate"]
  image: docker:27
  services:
    - docker:27-dind
  before_script:
    - docker info
  script:
    - docker build -f apps/web/Dockerfile --build-arg NEXT_PUBLIC_API_URL="$NEXT_PUBLIC_API_URL" -t workstream-web:ci .
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
      allow_failure: true
  timeout: 15m

# ---------------------------------------------------------------- deploy
# Auto-deploy to Railway on push to main, via the Railway CLI with a
# project-scoped token. RAILWAY_TOKEN is a protected CI/CD variable
# (GitLab → Settings → CI/CD → Variables, or set via the API). Until the
# token exists `rules` keeps this job from running, but `rules` only gate
# execution — GitLab validates the whole config at pipeline creation, so a
# syntax error in a disabled job still fails the pipeline with zero jobs.
# Hence the single-quoted script lines below: a plain YAML scalar cannot
# contain ": ", which the -m message does.
#
# Scope note: account-scoped tokens must scope the project explicitly; a
# project-scoped token would pin it already. --project is belt-and-braces.
deploy-railway:
  stage: deploy
  needs: ["gate"]
  image: node:22
  # No cache. This job only installs the Railway CLI and runs `railway up`, so
  # it never needs the pnpm store — and `railway up` uploads the whole working
  # directory. Inheriting `default: cache:` made the runner unpack ~100k files
  # into $CI_PROJECT_DIR/.pnpm-store first, which pushed the upload to 867 MB
  # and Railway rejected it with HTTP 413. .gitignore does not list
  # .pnpm-store, so nothing filtered it out of the archive.
  # `cache: []` overrides the inherited block: nothing is restored, so there is
  # nothing to exclude. The root .railwayignore is the second, durable half of
  # this fix.
  cache: []
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $RAILWAY_TOKEN != null && $RAILWAY_TOKEN != ""
  script:
    - npm install -g @railway/cli
    - 'railway up --project "$RAILWAY_PROJECT_ID" --service web --environment production --detach -m "GitLab CI $CI_COMMIT_SHORT_SHA: $CI_COMMIT_TITLE"'
    - 'railway up --project "$RAILWAY_PROJECT_ID" --service api --environment production --detach -m "GitLab CI $CI_COMMIT_SHORT_SHA: $CI_COMMIT_TITLE"'
  variables:
    RAILWAY_PROJECT_ID: "e2c12b66-af3a-4a51-a285-874c7a6de7d4"
  timeout: 20m
