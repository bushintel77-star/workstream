# Workstream — GitLab CI/CD
#
# Quality gate (blocking): `pnpm run ci` + gitleaks + Playwright (3 shards).
# Production deploy (main only): Railway CLI `railway up` AFTER every gate job
# is green. Requires protected CI variable RAILWAY_TOKEN (project-scoped token
# for project e2c12b66-af3a-4a51-a285-874c7a6de7d4).
#
# Never deploy from a merge-request pipeline — only from main on_success.
# Deploy uploads honour `.railwayignore`; the deploy job sets cache: [] so the
# runner never unpacks .pnpm-store into the upload tree (HTTP 413 fix).

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

default:
  image: node:22
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store

variables:
  NEXT_PUBLIC_API_URL: "https://api-production-a8ff1.up.railway.app"
  PRODUCTION_API_URL: "https://api-production-a8ff1.up.railway.app"
  PRODUCTION_WEB_URL: "https://web-production-3c194.up.railway.app"
  PNPM_VERSION: "9.15.4"

stages:
  - gate
  - scan
  - e2e
  - docker
  - deploy

.pnpm_setup: &pnpm_setup
  - corepack enable
  - corepack prepare pnpm@${PNPM_VERSION} --activate
  - pnpm config set store-dir "$CI_PROJECT_DIR/.pnpm-store"

# ---------------------------------------------------------------- gate
# Authoritative static gate — identical to local `pnpm run ci`.
gate:
  stage: gate
  interruptible: true
  before_script:
    - *pnpm_setup
  script:
    - pnpm run ci
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
  timeout: 45m

# ---------------------------------------------------------------- scan
secret-scan:
  stage: scan
  needs: ["gate"]
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  script:
    - gitleaks detect --source "$CI_PROJECT_DIR" --config "$CI_PROJECT_DIR/.gitleaks.toml" --verbose
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
  timeout: 10m

# ---------------------------------------------------------------- e2e
# Playwright — blocking on MR and main. Deploy waits for all three shards.
e2e:
  stage: e2e
  needs: ["gate"]
  interruptible: true
  parallel: 3
  before_script:
    - *pnpm_setup
    - pnpm install --frozen-lockfile
    - pnpm --filter @workstream/web exec playwright install chromium --with-deps
    - pnpm exec turbo run build --filter=@workstream/api...
  script:
    - pnpm --filter @workstream/web exec playwright test --shard="$CI_NODE_INDEX/$CI_NODE_TOTAL"
  variables:
    CI: "true"
    AUTH_REQUIRED: "false"
    API_URL: "http://127.0.0.1:3001"
    PLAYWRIGHT_BASE_URL: "http://127.0.0.1:3002"
    NEXT_PUBLIC_API_URL: "http://127.0.0.1:3001"
    PLAYWRIGHT_BROWSERS_PATH: "$CI_PROJECT_DIR/.playwright"
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
      - .playwright
    when: always
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
  timeout: 45m

# ---------------------------------------------------------------- docker
# Optional image smoke — manual, does not gate deploy.
build-api-image:
  stage: docker
  needs: ["gate"]
  allow_failure: true
  image: docker:27
  services:
    - docker:27-dind
  before_script:
    - docker info
  script:
    - docker build -f apps/api/Dockerfile --build-arg BUILD_SHA="$CI_COMMIT_SHA" -t workstream-api:ci .
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
      allow_failure: true
  timeout: 15m

build-web-image:
  stage: docker
  needs: ["gate"]
  allow_failure: true
  image: docker:27
  services:
    - docker:27-dind
  before_script:
    - docker info
  script:
    - docker build -f apps/web/Dockerfile --build-arg NEXT_PUBLIC_API_URL="$NEXT_PUBLIC_API_URL" --build-arg NEXT_PUBLIC_BUILD_SHA="$CI_COMMIT_SHA" -t workstream-web:ci .
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
      allow_failure: true
  timeout: 15m

# ---------------------------------------------------------------- deploy
# API first (web depends on it), then web. Live probe before the job succeeds.
deploy-railway:
  stage: deploy
  needs:
    - gate
    - secret-scan
    - e2e
  image: node:22
  cache: []
  environment:
    name: production
    url: $PRODUCTION_WEB_URL
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $RAILWAY_TOKEN != null && $RAILWAY_TOKEN != ""
  script:
    - npm install -g @railway/cli
    - 'railway up --project "$RAILWAY_PROJECT_ID" --service api --environment production --detach -m "GitLab CI $CI_COMMIT_SHORT_SHA: $CI_COMMIT_TITLE"'
    - 'railway up --project "$RAILWAY_PROJECT_ID" --service web --environment production --detach -m "GitLab CI $CI_COMMIT_SHORT_SHA: $CI_COMMIT_TITLE"'
    - |
      echo "Waiting for production health checks..."
      ok=0
      for i in $(seq 1 36); do
        if curl -sf "$PRODUCTION_API_URL/readyz" | grep -q '"status":"ok"'; then
          ok=1
          break
        fi
        sleep 10
      done
      if [ "$ok" -ne 1 ]; then
        echo "API /readyz did not return ok within 6 minutes"
        exit 1
      fi
    - curl -sf "$PRODUCTION_API_URL/readyz"
    - |
      code=$(curl -s -o /dev/null -w "%{http_code}" "$PRODUCTION_WEB_URL/home")
      if [ "$code" != "200" ]; then
        echo "Web /home returned HTTP $code (expected 200)"
        exit 1
      fi
      echo "Web /home HTTP 200"
  variables:
    RAILWAY_PROJECT_ID: "e2c12b66-af3a-4a51-a285-874c7a6de7d4"
  timeout: 25m
