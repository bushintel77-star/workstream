# Fly.io app config for the Workstream API.
# Region: Sydney (syd) per the original spec §4.1.
#
# Deploy from the repo root so the Dockerfile can reach workspace packages:
#   flyctl deploy --config apps/api/fly.toml --dockerfile apps/api/Dockerfile
#
# First-time provisioning:
#   flyctl launch --no-deploy --copy-config --config apps/api/fly.toml \
#     --name workstream-api --region syd
#
# Required secrets before deploy:
#   flyctl secrets set CORS_ORIGIN="https://app.example.com"
#   flyctl secrets set PUBLIC_API_URL="https://workstream-api.fly.dev"
#   flyctl secrets set CORS_ORIGIN="https://workstream-web.fly.dev"
#   flyctl secrets set CLERK_SECRET_KEY="…"          # optional; dev fallback present
#   flyctl secrets set CLERK_PUBLISHABLE_KEY="…"     # optional
#   flyctl secrets set MAPBOX_TOKEN="…"              # optional; mock geocode/aerial if absent
#   flyctl secrets set ANTHROPIC_API_KEY="…"         # optional; mock design/audit if absent
#   flyctl secrets set OPENAI_API_KEY="…"            # optional; canned transcript if absent
#   Vicmap cadastral: keyless DELWP GeoServer WFS (no secret)

app = "construct-api"
primary_region = "syd"
kill_signal = "SIGINT"
kill_timeout = "5s"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3001"
  NODE_ENV = "production"
  AUTH_REQUIRED = "false"
  PORTAL_BASE_URL = "https://construct-web.fly.dev"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

# Optional async pipeline worker — enable after REDIS_URL is set.
# fly scale count worker=1 -a construct-api
[processes]
  app = "node dist/server.js"
  worker = "node dist/worker.js"

# Persistence: the JSON-snapshot store at packages/db/src/persist.ts writes to
# /repo/apps/api/data/store.json on every mutation. Single-machine pattern —
# scale to >1 only after migrating to managed Postgres (or Litestream → R2).
[mounts]
  source = "construct_data_v2"
  destination = "/repo/apps/api/data"
