[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/api/Dockerfile"
watchPatterns = [
  "apps/api/**",
  "packages/contracts/**",
  "packages/cad/**",
  "packages/db/**",
  "packages/domain/**",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml",
  "package.json",
  "apps/api/railway.toml",
]

[deploy]
healthcheckPath = "/readyz"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
