[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/web/Dockerfile"
watchPatterns = [
  "apps/web/**",
  "packages/contracts/**",
  "packages/domain/**",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml",
  "package.json",
  "apps/web/railway.toml",
]

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
startCommand = "node apps/web/server.js"

