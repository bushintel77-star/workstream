[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/api/Dockerfile"
watchPatterns = [
  "apps/api/**",
  "apps/web/**",
  "packages/contracts/**",
  "packages/db/**",
  "packages/domain/**",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml",
  "package.json",
  "railway.toml",
]

[deploy]
healthcheckPath = "/readyz"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

