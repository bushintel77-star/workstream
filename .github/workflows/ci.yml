name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Canvas-first reboot: public API on Railway.
  NEXT_PUBLIC_API_URL: https://api-production-a8ff1.up.railway.app

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm mobile:check-placeholders

      - run: pnpm web:check-portal-edge

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test

  e2e:
    name: playwright e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: typecheck
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    env:
      CI: true
      AUTH_REQUIRED: "false"
      API_URL: http://127.0.0.1:3001
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3002
      NEXT_PUBLIC_API_URL: http://127.0.0.1:3001
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm --filter @workstream/web exec playwright install chromium --with-deps
      - name: Build API workspace deps for e2e
        run: pnpm exec turbo run build --filter=@workstream/api...
      - run: pnpm test:e2e

  build-api:
    name: build api docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: typecheck
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Build (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: workstream-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-web:
    name: build web docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: typecheck
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: workstream-web:ci
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
