name: ci

# Workstream — GitHub Actions CI (2026-08-23).
#
# Jobs:
#   `gate`         — pnpm run ci (static gate; stress suites excluded from
#                    its vitest run)
#   `stress`       — the tier1 stress suites with their OWN budget, so a
#                    600s suite never times out against the gate's shared
#                    clock on contended runners (the failure that turned
#                    the gate red twice before the split)
#   `secret-scan`  — gitleaks
#   `e2e`          — Playwright matrix (6 shards, non-blocking signal)
#   `deploy`       — Railway CLI + live probe (main only; needs gate + secret-scan)
#
# Deploy is decoupled from e2e and stress. e2e runs on every push and PR as a
# signal, never blocks deploy.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel a superseded run when a new commit lands on the same ref, so
# back-to-back pushes don't pile up runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "9.15.4"
  NEXT_PUBLIC_API_URL: "https://api-production-a8ff1.up.railway.app"
  PRODUCTION_API_URL: "https://api-production-a8ff1.up.railway.app"
  PRODUCTION_WEB_URL: "https://web-production-3c194.up.railway.app"

jobs:
  # ---------------------------------------------------------------- gate
  # Authoritative static gate — identical to local `pnpm run ci`.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm run ci

  # ---------------------------------------------------------------- scan
  secret-scan:
    runs-on: ubuntu-latest
    needs: [gate]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          # v3's breaking change: gitleaks-action now calls the GitHub API to
          # comment on PRs and requires this token to do so — the action's
          # `with:` inputs were removed entirely (config included) in favour
          # of env vars. GITHUB_TOKEN is the auto-issued per-run token every
          # workflow gets for free, not a repo secret to configure.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  # ---------------------------------------------------------------- stress
  # The tier1 cost-lock stress suites (pipeline × 15–25 iterations). They ran
  # inside the gate's vitest run until 2026-09-05: green assertions, red
  # budget — twice — on contended 2-core runners. Their own job, their own
  # clock. Not in deploy's needs: deploy ships the static gate, not a soak.
  stress:
    needs: [gate]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:stress

  # ---------------------------------------------------------------- e2e
  # Playwright across 6 shards. Non-gating (continue-on-error) — the WebGL
  # specs render through software GL on hosted runners and are slow/flaky, so
  # a red shard must never block production. Artifacts on failure aid triage.
  e2e:
    needs: [gate]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    continue-on-error: true
    env:
      # Job-wide so the browser install and the test run use the SAME path —
      # a step-scoped value made install use the default cache and the test
      # look in ${{ github.workspace }}/.playwright (executable not found).
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workstream/web exec playwright install chromium --with-deps
      - run: pnpm exec turbo run build --filter=@workstream/api...
      - name: Playwright shard ${{ matrix.shard }}/6
        run: pnpm --filter @workstream/web exec playwright test --shard=${{ matrix.shard }}/6
        env:
          CI: "true"
          AUTH_REQUIRED: "false"
          API_URL: "http://127.0.0.1:3001"
          PLAYWRIGHT_BASE_URL: "http://127.0.0.1:3002"
          NEXT_PUBLIC_API_URL: "http://127.0.0.1:3001"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: test-results/
          retention-days: 14

  # ---------------------------------------------------------------- deploy
  # API first, then web; live probe before the job succeeds. Decoupled from
  # e2e — runs on the static gate + secret scan only. RAILWAY_TOKEN is a
  # repository secret (Settings -> Secrets and variables -> Actions).
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [gate, secret-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install -g @railway/cli
      - name: Deploy api
        run: railway up --project "$RAILWAY_PROJECT_ID" --service api --environment production --detach -m "GitHub Actions ${GITHUB_SHA:0:8}"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: "e2c12b66-af3a-4a51-a285-874c7a6de7d4"
      - name: Deploy web
        run: railway up --project "$RAILWAY_PROJECT_ID" --service web --environment production --detach -m "GitHub Actions ${GITHUB_SHA:0:8}"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: "e2c12b66-af3a-4a51-a285-874c7a6de7d4"
      - name: Wait for API health
        run: |
          ok=0
          for i in $(seq 1 36); do
            if curl -sf "$PRODUCTION_API_URL/readyz" | grep -q '"status":"ok"'; then ok=1; break; fi
            sleep 10
          done
          [ "$ok" -eq 1 ] || { echo "API /readyz did not return ok within 6 minutes"; exit 1; }
      - name: Probe web
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" "$PRODUCTION_WEB_URL/home")
          [ "$code" = "200" ] || { echo "Web /home returned HTTP $code (expected 200)"; exit 1; }
          echo "Web /home HTTP 200"
