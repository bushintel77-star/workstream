name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to Fly after CI (main only)
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_API_URL: https://construct-api.fly.dev

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

  build-api:
    name: build api docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: typecheck
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: construct-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-web:
    name: build web docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: typecheck
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: construct-web:ci
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: deploy api + web to fly
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [typecheck, build-api, build-web]
    if: >
      (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy == true)
    concurrency:
      group: fly-deploy
      cancel-in-progress: false
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN || secrets.BROKKER }}
    steps:
      - uses: actions/checkout@v6
      - name: Install flyctl
        run: |
          curl -fsSL https://fly.io/install.sh | sh
          echo "$HOME/.fly/bin" >> "$GITHUB_PATH"
      - name: Deploy API
        run: |
          for i in 1 2 3 4 5; do
            flyctl deploy --config apps/api/fly.toml --dockerfile apps/api/Dockerfile \
              -a construct-api --remote-only && exit 0
            echo "fly deploy api attempt $i failed; retry in 30s..."
            sleep 30
          done
          exit 1
      - name: Deploy Web
        run: |
          for i in 1 2 3 4 5; do
            flyctl deploy --config apps/web/fly.toml --dockerfile apps/web/Dockerfile \
              -a construct-web --remote-only \
              --build-arg NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }} && exit 0
            echo "fly deploy web attempt $i failed; retry in 30s..."
            sleep 30
          done
          exit 1
      - name: Smoke test API
        run: |
          for i in 1 2 3 4 5; do
            curl -sfS https://construct-api.fly.dev/healthz && exit 0
            sleep 10
          done
          exit 1
      - name: Smoke test Web
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" https://construct-web.fly.dev/)
            if [ "$code" = "200" ] || [ "$code" = "307" ] || [ "$code" = "308" ]; then exit 0; fi
            sleep 10
          done
          exit 1
