name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to Fly after CI (main only)
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_API_URL: https://construct-api.fly.dev

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm mobile:check-placeholders

      - name: Check portal edge imports
        run: test -z "$(grep -r \"import.*'fs'\" apps/web/src/app/portal/ || true)"

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test

  e2e:
    name: playwright e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: typecheck
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    env:
      CI: true
      AUTH_REQUIRED: "false"
      API_URL: http://127.0.0.1:3001
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3002
      NEXT_PUBLIC_API_URL: http://127.0.0.1:3001
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm --filter @workstream/web exec playwright install chromium --with-deps
      - name: Build API workspace deps for e2e
        run: pnpm exec turbo run build --filter=@workstream/api...
      - run: pnpm test:e2e

  build-api:
    name: build api docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: typecheck
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: construct-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-web:
    name: build web docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: typecheck
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: construct-web:ci
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-api:
    name: deploy construct-api
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [typecheck, build-api]
    if: >
      (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy == true)
    concurrency:
      group: fly-deploy-api
      cancel-in-progress: false
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN || secrets.BROKKER }}
    steps:
      - uses: actions/checkout@v6
      - name: Install flyctl
        run: |
          curl -fsSL https://fly.io/install.sh | sh
          echo "$HOME/.fly/bin" >> "$GITHUB_PATH"
      - name: Verify Fly token (API)
        run: flyctl apps list | grep -F construct-api
      - name: Deploy API
        run: |
          for i in 1 2 3 4 5; do
            flyctl deploy --config apps/api/fly.toml --dockerfile apps/api/Dockerfile \
              -a construct-api --remote-only && exit 0
            echo "fly deploy api attempt $i failed; retry in 30s..."
            sleep 30
          done
          exit 1
      - name: Smoke test API
        run: |
          for i in 1 2 3 4 5; do
            curl -sfS https://construct-api.fly.dev/healthz && exit 0
            sleep 10
          done
          exit 1

  deploy-web:
    name: deploy construct-web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [typecheck, build-web]
    if: >
      (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy == true)
    concurrency:
      group: fly-deploy-web
      cancel-in-progress: false
    env:
      # Per-app deploy token — was stored as FLY_API_WEB but never wired in CI.
      FLY_API_TOKEN: ${{ secrets.FLY_API_WEB || secrets.FLY_API_TOKEN || secrets.BROKKER }}
    steps:
      - uses: actions/checkout@v6
      - name: Install flyctl
        run: |
          curl -fsSL https://fly.io/install.sh | sh
          echo "$HOME/.fly/bin" >> "$GITHUB_PATH"
      - name: Verify Fly token (web)
        run: flyctl apps list | grep -F construct-web
      - name: Deploy Web
        run: |
          for i in 1 2 3 4 5; do
            flyctl deploy --config apps/web/fly.toml --dockerfile apps/web/Dockerfile \
              -a construct-web --remote-only \
              --build-arg NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }} && exit 0
            echo "fly deploy web attempt $i failed; retry in 30s..."
            sleep 30
          done
          exit 1
      - name: Smoke test Web
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" https://construct-web.fly.dev/)
            if [ "$code" = "200" ] || [ "$code" = "307" ] || [ "$code" = "308" ]; then exit 0; fi
            sleep 10
          done
          exit 1
